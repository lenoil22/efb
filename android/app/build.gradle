apply plugin: 'com.android.application'

android {
    namespace 'de.efbwaechter.app'
    compileSdk 36

    defaultConfig {
        applicationId 'de.efbwaechter.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // nur zum Selbst-Installieren, nicht für den Play Store
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
