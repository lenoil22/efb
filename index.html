<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EFB · Bordcomputer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, präzise, Cockpit bei Nacht
   IDEA: die Papier-Checkliste im Cockpit – Schalter links, Pünktchen, Stellung rechts
   PICTURE: die Liste selbst; im Funk die Frequenz als größte Zahl
   COLOUR and TYPE: Nachtblau, ECAM-Grün für Werte, Cyan nur für den einen Knopf, Amber für Hinweise; B612
   LAYOUT: eine Spalte, oben was jetzt zählt, unten fester Weiter-Knopf */
:root{--bg:#0a0f16;--p1:#111821;--p2:#18212d;--line:#1d2836;--ink:#e9eef5;--dim:#7d8ea3;--mut:#526276;--g:#3fe08a;--a:#ffb020;--c:#3cc8ff;--r:#ff5a5a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "B612",system-ui,sans-serif;overflow-x:clip}
.mono{font-family:"B612 Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 18px 9px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header .cs{font:700 15px "B612 Mono",monospace;color:var(--g)}
header .rt{font:12px "B612 Mono",monospace;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}.dot.on{background:var(--g)}.dot.err{background:var(--r)}
#sync{font-size:11px;color:var(--mut)}#sync.me{font:12px "B612 Mono",monospace;color:var(--ink)}
.gear{color:var(--dim);display:flex;padding:6px}.gear svg{width:20px;height:20px}.gear.act{color:var(--ink)}
main{padding:18px 18px calc(170px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:9px 4px 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px}
nav button svg{width:20px;height:20px}nav button.act{color:var(--ink)}
section.tab{display:none}section.tab.act{display:block}
h2{font-size:24px;line-height:1.15;font-weight:700;margin:0 0 4px}
h3,.lbl{font-size:11px;letter-spacing:.07em;color:var(--dim);font-weight:400;margin:22px 0 7px;text-transform:uppercase}
.card{padding:0 0 16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim)}
input,select,textarea{font:15px "B612 Mono",monospace;background:var(--p1);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;text-transform:uppercase}
input:placeholder-shown{border-color:#ffb02040}
input:focus,textarea:focus,select:focus{outline:2px solid var(--c);outline-offset:0}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--c);color:#04121c;border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:none;color:var(--r);border:1px solid #ff5a5a44}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:12px;color:var(--dim);margin-top:6px}.msg.err{color:var(--r)}.msg.ok{color:var(--g)}
.empty{color:var(--dim);font-size:14px}
a{color:var(--c)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button,.chip{font:13px "B612 Mono",monospace;padding:7px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink);min-height:36px;white-space:nowrap}
.opts button.sel,.chip.on{border-color:var(--c);color:var(--c)}
.optsep{font-size:12px;color:var(--dim);align-self:center;padding:0 4px}
/* Funk */
.phs{display:flex;gap:2px;margin:0 0 22px;overflow-x:auto}
.phs button{font-size:12px;color:var(--dim);padding:6px 11px;border-radius:99px;white-space:nowrap}
.phs button.act{color:var(--bg);background:var(--ink)}
.stn-name{font-size:22px;font-weight:700;line-height:1.2}
.freq{font:700 clamp(44px,12vw,68px)/1.05 "B612 Mono",monospace;color:var(--g);margin:2px 0 4px;letter-spacing:-.01em}
.freq.off{color:var(--a);font-size:clamp(30px,8vw,40px)}
.sub{font-size:12px;color:var(--dim);margin:0}
.say{font-size:18px;line-height:1.6}
.vok{color:var(--g);cursor:pointer}
.vmiss{color:var(--a);border-bottom:1px dashed var(--a);cursor:pointer}
.sp{display:none;color:var(--c);font-size:13px;margin-top:6px;font-style:italic}.show-sp .sp{display:block}
.atcl{color:var(--dim);font-size:14px;line-height:1.55}
.rbk{font:14px/1.6 "B612 Mono",monospace;color:var(--ink)}
.rb{display:flex;gap:6px;flex-wrap:wrap}.rb span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.tiny{font-size:12px;color:var(--dim);margin-top:14px;text-decoration:underline;text-underline-offset:3px}
.warnbox{color:var(--a);font-size:13px;margin-top:12px}
.warnbox button{color:var(--c);text-decoration:underline;margin-left:4px}
.bar{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:9px 14px}
.reqbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.reqbar::-webkit-scrollbar{display:none}
.reqbar .chip{flex:none}.reqbar .sep{width:1px;background:var(--line);flex:none;margin:6px 4px}
.reqbar .chip.em{color:var(--r);border-color:#ff5a5a44}
/* Checklisten */
.pghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.pghead .lbl{margin:0}
.pghead select{width:auto;max-width:60%;font:12px "B612",sans-serif;text-transform:none;color:var(--dim);background:none;border:1px solid var(--line);padding:6px 8px}
.when{font-size:13px;color:var(--a);margin:0 0 16px}
.r{display:flex;align-items:baseline;gap:8px;padding:6px 0;font:14px/1.35 "B612 Mono",monospace;cursor:pointer}
.r .who{width:24px;font-size:10px;color:var(--mut);flex:none}
.r .dots{flex:1;border-bottom:1px dotted #2b3b50;min-width:14px;transform:translateY(-4px)}
.r .v{color:var(--c);text-align:right;max-width:55%}
.r.other .i{color:#a9b6c5}
.r.x .i,.r.x .v{color:var(--mut);text-decoration:line-through}
.r.rz .i,.r.rz .v{color:#4a5a6d}.r.rz .who{color:#3a4859}.r.rz .dots{border-bottom-color:#1f2a38}
.r.rz+.note{color:#45535f}
.rzleg{font-size:11px;color:var(--mut);margin:-8px 0 12px}.rzleg span{color:#4a5a6d;border-bottom:1px dotted #4a5a6d}
.note{font-size:11px;color:var(--mut);margin:-3px 0 3px 32px;line-height:1.4}
.call{font-size:15px;color:#b8c6d6;padding:7px 10px;margin:5px 0 5px 26px;border-left:3px solid #2c3a4c;background:#0f1722;border-radius:4px;line-height:1.4}.call b{display:inline-block;min-width:32px;font-size:11px;color:#6f8093;letter-spacing:.5px}.call.me{border-left-color:var(--c);color:#fff;font-weight:600}.call.me b{color:var(--c)}.call i{display:block;font-size:12px;color:#7d8da0;font-weight:400;font-style:normal;margin:2px 0 0 32px}
.call b{font-style:normal;font-size:10px;color:var(--mut);font-weight:400;margin-right:6px}
.sec{font-size:11px;letter-spacing:.07em;color:var(--a);margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.sec small{color:var(--mut);letter-spacing:0;margin-left:6px}
.line{font-size:10px;letter-spacing:.07em;color:var(--a);text-align:center;border-top:1px solid #ffb02088;margin:8px 0 4px;padding-top:3px}
.flink{display:block;width:100%;text-align:left;color:var(--c);font-size:13px;padding:7px 0 7px 32px}
.fhint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--a);margin:0 0 8px}
.fhint span{flex:1;line-height:1.35}.fhint b{color:var(--ink);font-weight:400}
.fhint .go{flex:none;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:5px 12px;min-height:36px;font-size:13px}
.fhint .no{flex:none;color:var(--mut);font-size:18px;width:36px;min-height:36px}
.pnav{display:flex;gap:8px}
.pnav .b1{width:54px;border:1px solid var(--line);border-radius:12px;color:var(--dim);font-size:20px;min-height:52px}
.pnav .b2{flex:1;background:var(--c);color:#04121c;border-radius:12px;min-height:52px;font-weight:700;font-size:15px;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Karte, Wetter, Rest */
.stn{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.stn:first-of-type{border-top:0}
.stn .role{width:56px;color:var(--dim);font-size:11px;flex:none}
.stn .who{flex:1;font:13px "B612 Mono",monospace}
.stn .fq{font:700 17px "B612 Mono",monospace;color:var(--g)}
.wplbl{background:none;border:0;box-shadow:none;color:var(--c);font:11px "B612 Mono",monospace;padding:0}
.wplbl::before{display:none}
.met .raw{font:12px "B612 Mono",monospace;color:var(--dim);word-break:break-word}
.met ul{margin:8px 0 0;padding-left:16px;font-size:14px}
.atis{font:12px "B612 Mono",monospace;color:var(--mut);white-space:pre-wrap;margin-top:6px}
.big{font:700 30px "B612 Mono",monospace;color:var(--g)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 28px}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(420px,100%)}
.modal .box h3{color:var(--ink);font-size:16px;text-transform:none;letter-spacing:0;margin:0 0 10px}
select{appearance:auto}
@media(prefers-reduced-motion:no-preference){section.tab.act{animation:in .2s ease-out}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<header>
  <div class="cs mono" id="hCs">EFB</div>
  <div class="rt mono" id="hRt">Kein Flug geladen</div>
  <span id="sync">–</span><span class="dot" id="hDot"></span>
  <button id="hSet" class="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
</header>

<main>
<!-- FLUG -->
<section class="tab" id="t-flug">
  <h2>Flug</h2>
  <div class="card">
    <h3>SimBrief</h3>
    <div class="row">
      <input id="sbUser" style="flex:1 1 220px;text-transform:none" placeholder="SimBrief-Benutzername" autocomplete="off">
      <button class="btn" id="sbLoad">Letzten Plan laden</button>
    </div>
    <div class="msg" id="sbMsg">Lädt deinen zuletzt erstellten Plan. Leere Felder sind gelb umrandet.</div>
  </div>
  <div class="card">
    <h3>VATSIM-Position</h3>
    <div class="msg" id="vPos"></div>
  </div>
  <div class="card">
    <h3>Flugdaten</h3>
    <div class="grid" id="fGrid"></div>
    <label class="f" style="margin-top:10px">Route<textarea id="f-route" data-k="route"></textarea></label>
  </div>
  <div class="row"><button class="btn warn" id="newFlight">Neuer Flug</button></div>
</section>

<!-- FUNK -->
<section class="tab" id="t-funk">
  <div class="phs" id="phases"></div>
  <div id="funkBody"></div>
</section>

<!-- CHECKLISTEN -->
<section class="tab" id="t-check">
  <div id="ckBody"></div>
</section>

<!-- EINSTELLUNGEN -->
<section class="tab" id="t-set">
  <h2>Einstellungen</h2>
  <div id="setBody"></div>
</section>

<!-- INFO -->
<section class="tab" id="t-info">
  <h2>Wetter &amp; Lotsen</h2>
  <div class="two" id="infoBody"></div>
  <div class="card"><h3>Online an Abflug &amp; Ziel</h3><div id="onlineList" class="empty">Noch keine VATSIM-Daten.</div></div>
  <div class="card"><h3>Karten</h3><a href="https://charts.navigraph.com/" target="_blank" rel="noopener" class="btn ghost" style="display:inline-block;text-decoration:none">Navigraph Charts öffnen</a></div>
</section>
</main>



<nav id="nav">
  <button data-t="flug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 16l20-6-20-6 4 6-4 6z"/></svg>Flug</button>
  <button data-t="funk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="10" height="15" rx="2"/><path d="M12 7V2M10 12h4M10 16h4"/></svg>Funk</button>
  <button data-t="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>Checklisten</button>
  <button data-t="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15a4 4 0 014-4 5 5 0 019.6 1.5A3.5 3.5 0 1117 19H8a4 4 0 01-4-4z"/></svg>Wetter</button>
</nav>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle">Wert</h3>
  <input id="mInput" autocomplete="off">
  <div class="opts" id="mOpts"></div>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button class="btn ghost" id="mCancel">Abbrechen</button><button class="btn" id="mOk">OK</button>
  </div>
</div></div>

<script>
{
/* ---------- Grundlagen ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='efb.v1';
const blank=()=>({cs:'',type:'',dep:'',arr:'',altn:'',gate:'',arrGate:'',crz:'',route:'',sid:'',star:'',exitFix:'',depRwy:'',arrRwy:'',squawk:'',atisDep:'',atisArr:'',qnhDep:'',qnhArr:'',clearedAlt:'',passing:'',nextFix:'',hdg:'',appType:'ILS',climb:'',climbMode:'sid',ta:'',tl:'',tod:'',fuel:'',trim:'',flaps:'',vspeeds:'',mins:'',clrType:'sid',wps:[],depPos:null,arrPos:null,depElev:'',arrElev:''});
let S={user:'OnboardTransponder595',f:blank(),phase:'boden',mem:{},ck:{},tab:'flug',req:null,sp:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S={...S,...s,f:{...blank(),...s.f}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const F=()=>S.f;

/* ---------- Funk-Aussprache ---------- */
const NATO={A:'Alfa',B:'Bravo',C:'Charlie',D:'Delta',E:'Echo',F:'Foxtrot',G:'Golf',H:'Hotel',I:'India',J:'Juliett',K:'Kilo',L:'Lima',M:'Mike',N:'November',O:'Oscar',P:'Papa',Q:'Quebec',R:'Romeo',S:'Sierra',T:'Tango',U:'Uniform',V:'Victor',W:'Whiskey',X:'X-ray',Y:'Yankee',Z:'Zulu'};
const DIG=['zero','one','two','tree','four','fife','six','seven','eight','niner'];
const AIRL={DLH:'Lufthansa',EWG:'Eurowings',CFG:'Condor',BAW:'Speedbird',EZY:'Easy',EJU:'Alpine',RYR:'Ryanair',KLM:'KLM',AFR:'Airfrance',SWR:'Swiss',AUA:'Austrian',UAE:'Emirates',THY:'Turkish',SAS:'Scandinavian',WZZ:'Wizz Air',TUI:'Tuifly',BEL:'Beeline',LOT:'Lot',IBE:'Iberia',VLG:'Vueling',DAL:'Delta',UAL:'United',AAL:'American',QTR:'Qatari',ETD:'Etihad',SIA:'Singapore',ACA:'Air Canada',FIN:'Finnair',ICE:'Iceair',NAX:'Nor Shuttle',VOE:'Volotea',PGT:'Sunturk',GWI:'Germanwings',CLH:'Hansaline',DLA:'Dolomiti',SXS:'Sunexpress',MSR:'Egyptair',AEE:'Aegean'};
const CITY={EDDB:'Berlin',EDDF:'Frankfurt',EDDM:'Munich',EDDH:'Hamburg',EDDL:'Düsseldorf',EDDK:'Cologne',EDDS:'Stuttgart',EDDN:'Nuremberg',EDDW:'Bremen',EDDV:'Hannover',EDDP:'Leipzig',EDDC:'Dresden',EDDR:'Saarbrücken',EDDE:'Erfurt',EDLW:'Dortmund',EDJA:'Memmingen',EDFH:'Hahn',EDNY:'Friedrichshafen',EGLL:'Heathrow',EGKK:'Gatwick',EGSS:'Stansted',EHAM:'Schiphol',LFPG:'De Gaulle',LOWW:'Wien',LSZH:'Zurich',LSGG:'Geneva',EKCH:'Kastrup',ESSA:'Arlanda',ENGM:'Gardermoen',EPWA:'Okecie',LKPR:'Ruzyne',LIRF:'Fiumicino',LEMD:'Barajas',LEPA:'Palma',LPPT:'Lisboa',EBBR:'Brussels',EIDW:'Dublin',LGAV:'Athinai',LTFM:'Istanbul',EDWW:'Bremen',EDGG:'Langen',EDMM:'Munich',EDUU:'Rhein',EDYY:'Maastricht'};
const sp1=c=>/\d/.test(c)?DIG[+c]:(NATO[c]||c);
const spell=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').split('').map(sp1).join(' ');
const digits=s=>String(s||'').replace(/\D/g,'').split('').map(d=>DIG[+d]).join(' ');
const csSp=cs=>{cs=String(cs||'').toUpperCase();const m=cs.match(/^([A-Z]{3})(\w+)$/);return m&&AIRL[m[1]]?AIRL[m[1]]+' '+spell(m[2]):spell(cs)};
const rwySp=r=>{const m=String(r||'').toUpperCase().match(/^(\d{1,2})([LRC]?)$/);if(!m)return spell(r);return digits(m[1])+({L:' left',R:' right',C:' center'}[m[2]]||'')};
const freqSp=f=>{let[a,b='']=String(f||'').split('.');b=b.replace(/0+$/,'')||'0';return digits(a)+' decimal '+digits(b)};
const thou=n=>{const t=Math.floor(n/1000),h=Math.round((n%1000)/100);return (t?digits(t)+' thousand':'')+(h?' '+DIG[h]+' hundred':'')};
const altSp=v=>{v=String(v||'').toUpperCase().trim();if(!v)return'';if(v.startsWith('FL'))return'flight level '+digits(v);const n=parseInt(v.replace(/\D/g,''));return isNaN(n)?v.toLowerCase():thou(n)+' feet'};
const sidSp=s=>{const m=String(s||'').toUpperCase().match(/^([A-Z]+)(\d)([A-Z]{1,2})$/);if(!m)return String(s||'').toLowerCase();let n=m[1];const ef=(F().exitFix||'').toUpperCase();if(ef.startsWith(n))n=ef;else if(F().star&&s===F().star)n=m[1];return n.charAt(0)+n.slice(1).toLowerCase()+' '+DIG[+m[2]]+' '+m[3].split('').map(c=>NATO[c]).join(' ')};
const aptSp=i=>CITY[String(i||'').toUpperCase()]||spell(i);
const fixSp=f=>{f=String(f||'');return f.length>3?f.charAt(0)+f.slice(1).toLowerCase():spell(f)};
const lvl=v=>{v=String(v||'').toUpperCase().trim();if(/^\d{3}$/.test(v))return'FL'+v;if(/^FL\d{2,3}$/.test(v))return v;return v};

/* Felder: Beschriftung, Aussprache, Eingabeart, Vorschläge */
const K={
 cs:{l:'Callsign',sp:csSp},type:{l:'Flugzeug'},dep:{l:'Abflug',sp:aptSp},arr:{l:'Ziel',sp:aptSp},altn:{l:'Ausweich'},
 gate:{l:'Stand (Abflug)',sp:spell},arrGate:{l:'Stand (Ziel)',sp:spell},crz:{l:'Reiseflughöhe',sp:altSp,o:['FL280','FL320','FL360']},
 sid:{l:'SID',sp:sidSp},star:{l:'STAR',sp:sidSp},exitFix:{l:'SID-Endpunkt',sp:fixSp},depRwy:{l:'Piste Abflug',sp:rwySp},arrRwy:{l:'Piste Ziel',sp:rwySp},

const POS={p:null,vs:null,prev:null,hk:''};

function trackMe(){
  const cs=myCs();const p=cs?(V.pil||[]).find(x=>String(x.callsign).toUpperCase()===cs):null;
  if(!p||Date.now()-Date.parse(p.last_updated)>180000){POS.p=null;POS.vs=null;POS.prev=null;return}
  const t=Date.parse(p.last_updated);
  if(POS.prev&&POS.prev.cs===cs&&t>POS.prev.t)POS.vs=Math.round((p.altitude-POS.prev.alt)/((t-POS.prev.t)/60000));

}
function nmTo(a,b){if(!b)return null;const R=3440.065,r=x=>x*Math.PI/180;const dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const ftOf=v=>{v=String(v||'').toUpperCase();const n=parseInt(v.replace(/\D/g,''));return isNaN(n)?0:v.startsWith('FL')?n*100:n};
function altTxt(a,gs){if(gs!=null&&gs<40)return'am Boden';const ta=ftOf(F().ta)||5000;return a>=ta?'FL'+String(Math.round(a/100)).padStart(3,'0'):Math.round(a/100)*100+' ft'}
/* Phase aus Höhe, GS, Steigrate und Entfernung zu Abflug/Ziel → Seiten-ID im Leitfaden */
function guessPhase(){
  const p=POS.p;if(!p)return null;const f=F(),me=[p.latitude,p.longitude];
  const dD=nmTo(me,f.depPos),dA=nmTo(me,f.arrPos);
  const atArr=dA!=null&&(dD==null||dA<dD);const elev=+(atArr?f.arrElev:f.depElev)||0,agl=p.altitude-elev,gs=p.groundspeed;
  let vs=POS.vs;
  if(vs==null){const crz=ftOf(f.crz);vs=crz&&p.altitude<crz-2000?(atArr?-1000:1000):0}
  const ta=ftOf(f.ta)||5000,tl=ftOf(f.tl)||7000,tod=parseInt(f.tod)||0;
  if(gs<40){if(atArr)return gs<3?['park','am Stand']:['alnd','rollt nach der Landung'];return gs<3?null:['taxi','rollt']}
  if(!atArr&&dD!=null&&dD<8&&agl<1500&&vs>=0)return['tko','Start'];
  if(atArr&&dA<10&&agl<3000)return['final','Endanflug'];
  if(atArr&&dA<25&&agl<6000)return['iapp','Anflug'];
  if(vs>300){if(p.altitude<ta)return['atko','Steigflug'];if(p.altitude<10000)return['ta','Steigflug'];return['climb10','Steigflug']}
  if(vs<-300){if(p.altitude>=10000)return['tod','Sinkflug'];if(p.altitude>tl)return['desc10','Sinkflug'];return['tl','Sinkflug']}
  if(p.altitude>=10000){if(tod&&dA!=null&&dA<=tod)return['tod','Top of Descent erreicht'];if(tod&&dA!=null&&dA<=tod+40)return['dprep','kurz vor Top of Descent'];return['cruise','Reiseflug']}
  return atArr?['desc10','Sinkflug']:['ta','Steigflug'];
}

  const f=F();const cand=(V.pil||[]).filter(x=>x.flight_plan&&f.dep&&f.arr&&x.flight_plan.departure===f.dep.toUpperCase()&&x.flight_plan.arrival===f.arr.toUpperCase()).slice(0,6);

const pre=c=>c.callsign.split('_')[0];
/* Wer deckt eine Rolle an einem Platz ab (VATSIM top-down) */
function cover(role,icao){
  icao=(icao||'').toUpperCase();if(!icao)return null;
  for(const fac of CHAIN[role]){
    const list=V.ctl.filter(c=>c.facility===fac&&(fac>=6||fac===1?pre(c).slice(0,2)===icao.slice(0,2):pre(c)===icao));
    if(list.length){const c=list[0];const r=FAC[fac]==='APP'&&role==='DEP'?'DEP':FAC[fac];
      const nm=(fac>=6||fac===1)?(CITY[pre(c)]||pre(c)):(CITY[icao]||icao);
      return{cs:c.callsign,freq:c.frequency,role:r,spoken:nm+' '+ROLEWORD[r],covering:fac!==CHAIN[role][0]}}
  }return null;
}
function atisOf(icao,kind){
  icao=(icao||'').toUpperCase();const a=V.atis.filter(x=>pre(x)===icao);
  const pick=a.find(x=>x.callsign.includes(kind==='dep'?'_D_':'_A_'))||a.find(x=>!/_[AD]_/.test(x.callsign))||a[0];
  if(!pick)return null;const txt=(pick.text_atis||[]).join(' ');
  const rws=[];for(const m of txt.matchAll(/(?:RUNWAY|RWY)S?\s*(?:IN USE\s*)?(?:FOR\s+(?:DEPARTURE|LANDING|ARRIVAL)S?\s*)?((?:\d{2}\s?[LRC]?\b(?:\s*(?:AND|,|\/)?\s*)?)+)/gi))for(const r of m[1].matchAll(/\d{2}\s?[LRC]?/g)){const v=r[0].replace(/\s/g,'').toUpperCase();if(!rws.includes(v))rws.push(v)}
  const rw=rws.length?[0,rws[0]]:null;
  const q=txt.match(/QNH\s*(\d{3,4})/i)||txt.match(/\bQ(\d{4})\b/);
  return{cs:pick.callsign,freq:pick.frequency,code:pick.atis_code||'',rwy:rw?rw[1]:'',rws,qnh:q?q[1]:'',txt};
}

const WX={RA:'Regen',SN:'Schnee',DZ:'Niesel',TS:'Gewitter',FG:'Nebel',BR:'Dunst',HZ:'Trübung',SH:'Schauer',GR:'Hagel',FZ:'gefrierend'};
function decode(m,rwy){
  const o=[];let w=m.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/);
  if(w){o.push(`Wind ${w[1]==='VRB'?'umlaufend':w[1]+'°'} mit ${+w[2]} kt${w[3]?', Böen '+ +w[3]+' kt':''}`);
    const r=String(rwy||'').match(/^(\d{1,2})/);if(r&&w[1]!=='VRB'){const d=(+w[1]-r[1]*10)*Math.PI/180,s=+w[2];const hw=Math.round(s*Math.cos(d)),xw=Math.round(Math.abs(s*Math.sin(d)));o.push(`Piste ${rwy}: ${hw>=0?'Gegenwind '+hw:'Rückenwind '+(-hw)} kt, Seitenwind ${xw} kt`)}}
  if(/CAVOK/.test(m))o.push('CAVOK: Sicht über 10 km, keine Wolken unter 5000 ft');
  else{const v=m.match(/\s(\d{4})\s/);if(v)o.push('Sicht '+(v[1]==='9999'?'über 10 km':(+v[1])+' m'))}
  const wx=[...m.matchAll(/\s([-+]?)((?:SH|TS|FZ)?(?:RA|SN|DZ|FG|BR|HZ|GR|TS))\b/g)].map(x=>(x[1]==='-'?'leichter ':x[1]==='+'?'starker ':'')+x[2].match(/SH|TS|FZ|RA|SN|DZ|FG|BR|HZ|GR/g).map(c=>WX[c]).join(' '));if(wx.length)o.push(wx.join(', '));
  const cl=[...m.matchAll(/\b(FEW|SCT|BKN|OVC)(\d{3})/g)].map(x=>({FEW:'wenige',SCT:'aufgelockert',BKN:'durchbrochen',OVC:'bedeckt'}[x[1]])+' '+(+x[2]*100)+' ft');if(cl.length)o.push('Wolken: '+cl.join(', '));
  const t=m.match(/\s(M?\d{2})\/(M?\d{2})\s/);if(t)o.push(`Temperatur ${t[1].replace('M','-')} °C, Taupunkt ${t[2].replace('M','-')} °C`);
  const q=m.match(/\bQ(\d{4})\b/);if(q)o.push('QNH '+q[1]);
  return{o,qnh:q?q[1]:''};
}

const TIPS={DEP:'Höhe, die du durchfliegst, freigegebene Höhe, SID oder Heading.',CTR:'Callsign, Höhe und was du gerade fliegst. Im Steig- oder Sinkflug: „passing … climbing …“.',APP:'Höhe, STAR und ATIS-Kennung des Zielplatzes.',TWRarr:'Anflugart und Piste – mehr nicht.',GNDarr:'Piste frei und gewünschter Stand.'};
function renderFunk(){
  $('#phases').innerHTML=PH.map(([k,n])=>`<button data-ph="${k}" class="${S.phase===k?'act':''}">${n}</button>`).join('');
  const ph=S.phase,reqs=REQ[ph];
  let qi=S.req&&S.req.startsWith(ph)?+S.req.slice(ph.length):0;if(!reqs[qi])qi=0;const q=reqs[qi];
  let role,side;
  if(q.clr){role='DEL';side='dep'}else if(q.init){[role,side]=INITROLE[q.init]}else{role=q.r==='DEP'?'DEP':q.r;side=(q.r==='APP'||ph==='landung'||ph==='anflug')?'arr':'dep'}
  const st=stnCtx(role,side);CTX={stn:st};const c=st.c;
  const icao=side==='arr'?F().arr:F().dep;const at=atisOf(icao,side);
  let h=`<p class="lbl" style="margin-top:0">Jetzt rufen</p><div class="stn-name">${esc(st.d)}</div>`;
  h+=c?`<div class="freq">${esc(c.freq)}</div><p class="sub">${esc(c.cs)}${c.covering?' · übernimmt '+esc(role==='DEP'?'Departure':ROLEWORD[role]):''}${at?' · ATIS '+esc(at.code||'?')+' auf '+esc(at.freq):''}</p>`
       :`<div class="freq off">122.800</div><p class="sub">Niemand online – Unicom, Absichten blind senden${at?' · ATIS '+esc(at.code||'?'):''}</p>`;
  h+=`<div class="${S.sp?'show-sp':''}">`;
  if(q.clr)h+=clrBlock();
  else if(q.init)h+=`<p class="lbl">Du sagst</p>${phrase(INIT[q.init])}<p class="sub" style="margin-top:8px">${esc(TIPS[q.init]||'')}</p>`;
  else h+=`<p class="lbl">Du sagst</p>${phrase(q.you)}<p class="lbl">ATC antwortet meist</p><div class="atcl">${phrase(q.atc)}</div>${rb(q.rb)}`;
  h+=`</div><button class="tiny" data-q="sp">${S.sp?'Aussprache ausblenden':'Aussprache zeigen'}</button>`;
  h+=`<div class="bar"><div class="reqbar">${reqs.map((r,i)=>`<button class="chip ${i===qi?'on':''}" data-rq="${i}">${esc(r.n)}</button>`).join('')}<span class="sep"></span><button class="chip" data-q="sayagain">Say again</button><button class="chip" data-q="standby">Standby</button><button class="chip" data-q="unable">Unable</button><button class="chip em" data-q="em">Notfall</button></div></div>`;
  $('#funkBody').innerHTML=h;
}
function clrBlock(){
  const f=F();const dep=(f.dep||'').toUpperCase();const ef=(f.exitFix||'').toUpperCase();
  let sids=[...new Set([f.sid,...(S.mem[dep]||[])].filter(Boolean).map(x=>x.toUpperCase()))];
  sids.sort((a,b)=>(b===f.sid)-(a===f.sid)||(ef&&b.startsWith(ef.slice(0,4)))-(ef&&a.startsWith(ef.slice(0,4))));
  const at=atisOf(dep,'dep');
  let h=`<p class="lbl">Du sagst</p>${phrase(INIT.DEL)}`;
  h+=`<p class="lbl">Departure</p><div class="opts">`+sids.map(x=>`<button data-sid="${esc(x)}" class="${f.clrType==='sid'&&f.sid===x?'sel':''}">${esc(x)}</button>`).join('')+
     `<button data-clr="vec" class="${f.clrType==='vec'?'sel':''}">Vectors</button><button data-clr="hdg" class="${f.clrType==='hdg'?'sel':''}">Heading</button><button data-sid="__other">Andere</button></div>`;
  h+=`<p class="lbl">Piste im Readback</p><div class="opts"><button data-clrrwy="0" class="${S.set.clrRwy?'':'sel'}">Weglassen</button><button data-clrrwy="1" class="${S.set.clrRwy?'sel':''}">Mitlesen</button></div>`;
  /* Erst Art (climb via SID / initial climb), dann die Höhe – beides gehört zur Freigabe */
  const cm=f.climbMode==='init'?'init':'sid',alts=['4000','5000','6000','7000','FL70','FL100'];
  if(f.climb&&!alts.includes(f.climb))alts.push(f.climb);
  h+=`<p class="lbl">Steigen</p><div class="opts"><button data-cmode="sid" class="${cm==='sid'?'sel':''}">Climb via SID</button><button data-cmode="init" class="${cm==='init'?'sel':''}">Initial climb</button></div>`+
     `<div class="opts" style="margin-top:8px"><span class="optsep">bis</span>`+alts.map(x=>`<button data-climb="${esc(x)}" class="${f.climb===x?'sel':''}">${esc(x)}</button>`).join('')+`<button data-climb="__other">Andere</button></div>`;
  h+=`<p class="lbl">Squawk</p><div class="opts"><button data-e="squawk" class="${f.squawk?'sel':''}">${f.squawk?esc(f.squawk):'eintragen'}</button></div>`;
  if(at&&at.rwy&&f.depRwy&&!at.rws.includes(f.depRwy.toUpperCase()))h+=`<div class="warnbox">ATIS meldet ${esc(at.rws.join(' / '))}, geplant ist ${esc(f.depRwy)} – SID ändert sich wahrscheinlich.<button data-act="takeRwy">${esc(at.rwy)} übernehmen</button></div>`;
  const dpt=f.clrType==='vec'?'radar vectors':f.clrType==='hdg'?'heading {hdg}':'{sid} departure';
  const climb=(cm==='init'?'initial climb ':'climb via SID to ')+'{climb}';
  /* Deutsche DEL-Praxis: Departure, „flight planned route“, Steigen, Squawk – Piste meist nicht (optional) */
  h+=`<p class="lbl">Zurücklesen</p><div class="rbk">${phrase('Cleared to {arr}, '+dpt+(S.set.clrRwy?', runway {depRwy}':'')+', flight planned route, '+climb+', squawk {squawk}, {cs}')}</div>`;
  return h;
}

/* ---------- Einstellungen ---------- */
S.set={seat:'CA',role:'PF',mode:'guided',detail:'voll',other:true,tts:false,wake:true,clrRwy:false,rz:'dim',...(S.set||{})};
S.g={p:0,i:0,done:{},...(S.g||{})};
const SETS=[
 ['seat','Sitz',[['CA','Captain (links)'],['FO','First Officer (rechts)']]],
 ['role','Rolle',[['PF','Pilot Flying'],['PM','Pilot Monitoring']]],
 ['mode','Checklisten-Tab',[['list','Nur Normal Checklist'],['guided','Mit Leitfaden (Procedures + Checklist)']]],
 ['detail','Detail',[['voll','Voll – alles'],['kurz','Kurz – ohne Tests und Nebenpunkte']]],
 ['other','Schritte der anderen Seite im Leitfaden',[[true,'Anzeigen'],[false,'Ausblenden']]],
 ['rz','Nur-Realismus-Schritte im Leitfaden (im Sim schon so oder nur Kontrolle)',[['dim','Grau'],['normal','Normal'],['hide','Ausblenden']]],
 ['wake','Bildschirm an lassen',[[true,'An'],[false,'Aus']]],
];
/* ---------- Bildschirm an (Screen Wake Lock) ----------
   iPadOS gibt die Sperre bei jedem App-/Tab-Wechsel frei → bei „sichtbar“ neu anfordern.
   Safari will teils eine Berührung vorher → zusätzlich beim ersten Tippen anfordern. */
const wlOk='wakeLock' in navigator;
let WL=null,wlBusy=false,wlErr=false;
function wakeTxt(){
  if(!wlOk)return'Dieser Browser kann den Bildschirm nicht wach halten (iPad: Safari ab iPadOS 16.4).';
  if(!S.set.wake)return'Aus – der Bildschirm geht nach der Zeit aus, die am iPad eingestellt ist.';
  if(WL)return'Aktiv – der Bildschirm bleibt an.';
  return wlErr?'Noch nicht aktiv – einmal irgendwo in die App tippen.':'Wird angefordert …';
}
function wakeMsg(){const m=$('#wakeMsg');if(m)m.textContent=wakeTxt()}
async function wakeSync(){
  if(!wlOk)return;
  if(!S.set.wake){if(WL){const w=WL;WL=null;try{await w.release()}catch(e){}}wakeMsg();return}
  if(WL||wlBusy||document.visibilityState!=='visible'){wakeMsg();return}
  wlBusy=true;
  try{const w=await navigator.wakeLock.request('screen');WL=w;wlErr=false;w.addEventListener('release',()=>{if(WL===w)WL=null;wakeMsg()})}
  catch(e){WL=null;wlErr=true}
  wlBusy=false;wakeMsg();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wakeSync()});
document.addEventListener('pointerdown',()=>{if(S.set.wake&&!WL)wakeSync()},{passive:true});
function renderSet(){
  $('#setBody').innerHTML=SETS.map(([k,l,o])=>`<div class="card"><h3>${esc(l)}</h3><div class="opts">${o.map(([v,t])=>`<button data-set="${k}" data-v="${v}" class="${S.set[k]===v?'sel':''}">${esc(t)}</button>`).join('')}</div>${k==='wake'?`<p class="msg" id="wakeMsg">${esc(wakeTxt())}</p>`:''}</div>`).join('')+
  `<div class="card"><h3>SimBrief-Benutzername</h3><div class="row"><input id="setUser" style="flex:1 1 220px;text-transform:none" value="${esc(S.user||'')}"><button class="btn ghost" id="setUserSave">Speichern</button></div></div>
   <div class="card"><h3>Flug</h3><div class="row"><button class="btn warn" id="setNew">Neuer Flug (alles zurücksetzen)</button></div></div>
   <div class="card"><h3>Quellen</h3><p class="msg">Abläufe nach Airbus-A320-SOP-Struktur, abgeglichen mit der FlyByWire A32NX SOP, „A320 Normal Procedures" (TheAirlinePilots, 2025) und JayDees Fenix-A320-Guide v1.31.1 (Fenix-spezifische Schritte). Nur für die Flugsimulation.</p></div>`;
}

/* ---------- Checklisten-Seiten ---------- */
const CKMAP=Object.fromEntries(CK.map(c=>[c.id,c]));
function steps(ph){
  const out=[];
  ph.s.trim().split('\n').forEach(line=>{
    line=line.trim();if(!line)return;let x=false;
    if(line[0]==='~'){x=true;line=line.slice(1)}
    if(x&&S.set.detail==='kurz')return;
    let rz=false;if(line[0]==='^'){rz=true;line=line.slice(1);if(S.set.rz==='hide')return}
    if(line[0]==='@'){const p=line.slice(1).split('|');out.push({k:'call',r:p[0],t:p[1],n:p[2]||''});return}
    if(line[0]==='#'){const[id,part]=line.slice(1).split(':');const c=CKMAP[id];if(!c)return;
      const li=c.it.indexOf('LINE');let items=c.it.map((it,i)=>[it,i]).filter(([it])=>it!=='LINE');
      if(part==='down'&&li>=0)items=items.filter(([_,i])=>i<li);
      if(part==='below')items=items.filter(([_,i])=>li>=0&&i>li);
      out.push({k:'clh',n:c.n,part});
      items.forEach(([it,i])=>out.push({k:'cl',c:it[0],v:it[1],sub:it[2]||'',ck:c.id+i}));
      out.push({k:'cle',n:c.n,part});return}
    if(line[0]==='!'){const[a,label]=line.slice(1).split('|');const[fp,rq]=a.split(':');out.push({k:'funk',fp,rq,label});return}
    const[r,i,s,n]=line.split('|');
    const st={k:'do',r,i,s:s||'',n:n||'',rz:rz&&S.set.rz!=='normal'};
    if(!S.set.other&&!who(r).mine)return;
    out.push(st);
  });
  return out;
}
/* Wer ist dran? */
function who(r){
  const me=S.set.role,seat=S.set.seat;
  if(r==='PF'||r==='PM')return{mine:r===me,lbl:r===me?'DU · '+r:r};
  if(r==='CM'||r==='BOTH')return{mine:true,lbl:'BEIDE'};
  if(r==='CM1')return{mine:seat==='CA',lbl:seat==='CA'?'DU · Captain':'Captain'};
  if(r==='CM2')return{mine:seat==='FO',lbl:seat==='FO'?'DU · F/O':'First Officer'};
  return{mine:true,lbl:r};
}
const fillG=s=>String(s).replace(/\{(\w+)\}/g,(_,k)=>F()[k]||'____');
S.x=S.x||{};
function pages(){return S.set.mode==='guided'?FLOWS.map(p=>({id:p.id,n:p.n,t:p.t,opt:p.opt,f:p.f,p})):CK.filter(c=>!c.em).map(c=>({id:c.id,n:c.n,t:'',f:c.ph||S.phase,c}))}
const pkey=()=>S.set.mode==='guided'?'p':'c';
/* ---------- Funk ⇄ Checkliste: die Checkliste führt ----------
   Jede Checklisten-Seite hat ihre Funk-Anfrage. „Weiter“/Seitenwechsel stellt den Funk-Tab darauf.
   Ist der Funk weiter als die Checkliste, zeigt die Checkliste nur einen Hinweis (Sprung per Tipp).
   Rückwärts im Funk (Clearance noch mal ansehen …) ändert an der Checkliste nie etwas. */
const FQ={
 prelim:'boden:Clearance',walk:'boden:Clearance',ovhd:'boden:Clearance',ped:'boden:Clearance',glare:'boden:Clearance',brief:'boden:Clearance',
 bpush:'boden:Pushback',startclr:'boden:Pushback',eng:'boden:Pushback',after:'boden:Taxi',taxi:'boden:Taxi',lineup:'boden:Ready for departure',
 tko:'abflug:Erstanruf Departure',atko:'abflug:Erstanruf Departure',ta:'abflug:Höher steigen',climb10:'abflug:Höher steigen',
 cruise:'reise:Erstanruf Center',dprep:'reise:Sinkflug anfragen',tod:'reise:Sinkflug anfragen',
 desc10:'anflug:Erstanruf Approach',tl:'anflug:Erstanruf Approach',iapp:'anflug:Anflug wünschen',
 final:'landung:Erstanruf Tower',land:'landung:Erstanruf Tower',ga:'landung:Go-around',alnd:'landung:Runway vacated',park:'landung:Taxi to stand',secure:'landung:Taxi to stand',
 /* Modus „Nur Normal Checklist“ */
 bs:'boden:Pushback',as:'boden:Taxi',bt:'boden:Ready for departure',at:'abflug:Erstanruf Departure',ap:'anflug:Erstanruf Approach',ld:'landung:Erstanruf Tower',al:'landung:Runway vacated',pk:'landung:Taxi to stand',sa:'landung:Taxi to stand'
};
const RSEQ=PH.flatMap(([p])=>REQ[p].map((_,i)=>p+i));  /* alle Anfragen in Flugreihenfolge */
const rpos=r=>r?RSEQ.indexOf(r):-1;
const rPh=r=>r.replace(/\d+$/,''),rQ=r=>REQ[rPh(r)][+r.match(/\d+$/)[0]];
function pageReq(pg){const m=pg&&FQ[pg.id];if(!m)return null;const[p,n]=m.split(':');const i=REQ[p]?REQ[p].findIndex(q=>q.n===n):-1;return i<0?null:p+i}
function funkReq(){const p=S.phase;if(!REQ[p])return null;const i=S.req&&S.req.startsWith(p)?+S.req.slice(p.length):0;return p+(REQ[p][i]?i:0)}
function funkAhead(){
  const P=pages(),i=S.g[pkey()]||0,pc=rpos(pageReq(P[i])),r=funkReq(),pf=rpos(r);
  if(pf<0||pf<=pc||S.hintNo===r)return null;
  let best=-1,bp=-1;
  P.forEach((x,j)=>{if(j<=i)return;const p=rpos(pageReq(x));if(p<=pc||p>pf||(x.opt&&p!==pf))return;if(p>bp){bp=p;best=j}});
  return best<0?null:{j:best,r};
}
/* VATSIM-Position schlägt eine spätere Seite vor – nur Hinweis, nur vorwärts */
function posAhead(){
  const g=guessPhase();if(!g)return null;const id=S.set.mode==='guided'?g[0]:LMAP[g[0]];if(!id||S.posNo===id)return null;
  const P=pages(),i=S.g[pkey()]||0,j=P.findIndex(x=>x.id===id);
  return j>i?{j,id,t:(POS.p.groundspeed<40?'':altTxt(POS.p.altitude)+', ')+g[1]}:null;
}
function rowDo(i,v,key,who,note,other,rz){return`<div class="r ${S.x[key]?'x':''} ${other?'other':''} ${rz?'rz':''}" data-x="${key}"><span class="who">${esc(who||'')}</span><span class="i">${esc(i)}</span><span class="dots"></span><span class="v">${esc(v)}</span></div>${note?`<div class="note">${esc(note)}</div>`:''}`}
function renderCheck(){
  const P=pages(),k=pkey();let i=S.g[k]||0;if(i>=P.length)i=0;S.g[k]=i;const pg=P[i];
  const ni=P.findIndex((x,j)=>j>i&&!x.opt);
  let h=`<div class="pghead"><p class="lbl">${S.set.mode==='guided'?'Phase':'Checkliste'} ${i+1} / ${P.length}</p><select id="pgSel" aria-label="Phase wählen">${P.map((x,j)=>`<option value="${j}" ${j===i?'selected':''}>${j+1}. ${esc(x.n)}</option>`).join('')}</select></div><h2>${esc(pg.n)}</h2>`;
  h+=pg.t?`<p class="when">Wann: ${esc(fillG(pg.t))}</p>`:'<div style="height:12px"></div>';
  const SS=pg.p?steps(pg.p):[];
  if(SS.some(st=>st.rz))h+=`<p class="rzleg"><span>Grau</span> = im Sim schon so eingestellt oder nur Kontrolle. Für den Realismus, kann man überspringen.</p>`;
  if(pg.c){
    pg.c.it.forEach((x,j)=>{if(x==='LINE'){h+='<div class="line">below the line</div>';return}h+=rowDo(x[0].toUpperCase(),fillG(x[1]),pg.id+':'+j,'',x[2]||'')});
    if(pg.c.note)h+=`<p class="msg">${esc(pg.c.note)}</p>`;
  }else{
    SS.forEach((st,j)=>{const key=pg.id+':'+j;
      if(st.k==='do'){const w=who(st.r);h+=rowDo(fillG(st.i),fillG(st.s),key,w.mine&&!['CM','BOTH'].includes(st.r)?'':(st.r==='CM'||st.r==='BOTH'?'':st.r),S.set.detail==='voll'?fillG(st.n):'',!w.mine,st.rz)}
      else if(st.k==='call')h+=`<div class="call${who(st.r).mine?' me':''}"><b>${esc(st.r)}</b>„${esc(fillG(st.t))}“${st.n&&S.set.detail==='voll'?`<i>${esc(st.n)}</i>`:''}</div>`;
      else if(st.k==='clh')h+=`<div class="sec">${esc(st.n.toUpperCase())} CHECKLIST<small>${st.part==='down'?'bis zur Linie':st.part==='below'?'unter der Linie':''}</small></div>`;
      else if(st.k==='cl')h+=rowDo(st.c.toUpperCase(),fillG(st.v),key,'',st.sub);
      else if(st.k==='cle')h+=`<div class="call${who('PM').mine?' me':''}"><b>PM</b>„${esc(st.n)} checklist ${st.part==='down'?'down to the line':'complete'}.“</div>`;
      else if(st.k==='funk')h+=`<button class="flink" data-gfunk="${esc(st.fp)}|${esc(st.rq)}">Funk · ${esc(st.label)} →</button>`;
    });
    if(['final','land'].includes(pg.id))h+=`<button class="flink" style="color:var(--r)" id="gGA">Go Around →</button>`;
  }
  const ah=funkAhead(),ph=ah?null:posAhead();POS.hk=JSON.stringify(posAhead());
  h+=`<div class="bar">${ah?`<div class="fhint"><span>Funk ist bei <b>${esc(rQ(ah.r).n)}</b> – Checkliste zu ${esc(P[ah.j].n)} springen?</span><button class="go" id="fhGo">Springen</button><button class="no" id="fhNo" aria-label="Hinweis ausblenden">×</button></div>`
    :ph?`<div class="fhint"><span>VATSIM: <b>${esc(ph.t)}</b> – Checkliste zu ${esc(P[ph.j].n)} springen?</span><button class="go" id="phGo">Springen</button><button class="no" id="phNo" aria-label="Hinweis ausblenden">×</button></div>`:''}<div class="pnav"><button class="b1" id="pgPrev" aria-label="Zurück">‹</button><button class="b2" id="pgNext">${ni>=0?'Weiter: '+esc(P[ni].n):'Flug beendet'}</button></div></div>`;
  $('#ckBody').innerHTML=h;
}
function pgGo(n,keepFunk){
  const P=pages();if(n<0||n>=P.length)return;S.g[pkey()]=n;S.hintNo=null;
  if(!keepFunk){const r=pageReq(P[n]);if(r){S.phase=rPh(r);S.req=r}else{const f=P[n].f;if(f&&REQ[f]){S.phase=f;S.req=null}}}
  save();renderCheck();window.scrollTo(0,0);
}
$('#ckBody').addEventListener('click',e=>{
  const t=e.target;let b;
  if(t.closest('#pgNext')){const P=pages(),i=S.g[pkey()]||0;const ni=P.findIndex((x,j)=>j>i&&!x.opt);if(ni>=0)pgGo(ni);return}
  if(t.closest('#pgPrev')){pgGo((S.g[pkey()]||0)-1);return}
  if(t.closest('#gGA')){pgGo(FLOWS.findIndex(p=>p.id==='ga'));return}
  if(t.closest('#fhGo')){const a=funkAhead();if(a)pgGo(a.j,true);return}
  if(t.closest('#fhNo')){S.hintNo=funkReq();save();renderCheck();return}
  if(t.closest('#phGo')){const a=posAhead();if(a)pgGo(a.j);return}
  if(t.closest('#phNo')){const a=posAhead();if(a)S.posNo=a.id;save();renderCheck();return}
  if(b=t.closest('[data-gfunk]')){const[fp,rq]=b.dataset.gfunk.split('|');S.phase=fp;const i=REQ[fp].findIndex(q=>q.n===rq);S.req=fp+(i<0?0:i);save();tab('funk');return}
  if(b=t.closest('[data-x]')){const k=b.dataset.x;S.x[k]=!S.x[k];save();b.classList.toggle('x',!!S.x[k])}
});
$('#ckBody').addEventListener('change',e=>{if(e.target.id==='pgSel')pgGo(+e.target.value)});
$('#t-set').addEventListener('click',e=>{
  let b;if(b=e.target.closest('[data-set]')){const k=b.dataset.set;let v=b.dataset.v;if(v==='true')v=true;if(v==='false')v=false;S.set[k]=v;save();renderSet();if(k==='wake')wakeSync();return}
  if(e.target.closest('#setUserSave')){S.user=$('#setUser').value.trim();save();e.target.textContent='Gespeichert';return}
  if(e.target.closest('#setNew')){ask('Neuer Flug? Tippe JA','',['JA'],0,v=>{if(v==='JA'){S.f=blank();S.ck={};S.x={};S.g={p:0,c:0,done:{}};S.phase='boden';S.req=null;S.vcs=null;S.posNo=null;save();tab('flug')}})}
});
$('#hSet').onclick=()=>tab('set');
function renderOnline(){
  const f=F();if(!V.t){$('#onlineList').textContent=V.err?'VATSIM nicht erreichbar.':'Noch keine VATSIM-Daten.';return}
  const keys=[f.dep,f.arr].filter(Boolean).map(s=>s.toUpperCase());
  const list=V.ctl.filter(c=>keys.includes(pre(c))||(c.facility>=6&&keys.some(k=>pre(c).slice(0,2)===k.slice(0,2))));
  $('#onlineList').innerHTML=list.length?list.map(c=>`<div class="stn"><span class="role">${FAC[c.facility]||''}</span><span class="who mono">${esc(c.callsign)}</span><span class="fq">${esc(c.frequency)}</span></div>`).join(''):'<span class="empty">Auf deiner Strecke ist gerade niemand online – Unicom 122.800.</span>';
}

/* ---------- Info ---------- */
function renderInfo(){
  const f=F();const rows=[[f.dep,'dep','Abflug',f.depRwy],[f.arr,'arr','Ziel',f.arrRwy],[f.altn,'','Ausweich','']].filter(r=>r[0]);
  if(!rows.length){$('#infoBody').innerHTML='<div class="card empty">Lade zuerst einen Flug.</div>';return}
  $('#infoBody').innerHTML=rows.map(([icao,side,n,rwy])=>{
    icao=icao.toUpperCase();const m=MET[icao];const d=m?decode(m,rwy):null;const a=side?atisOf(icao,side):null;
    let h=`<div class="card met"><h3>${n} · <span class="mono" style="color:var(--ink)">${esc(icao)}</span></h3>`;
    h+=m?`<div class="raw">${esc(m)}</div><ul>${d.o.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="empty">Kein METAR.</div>';
    if(side){
      if(a){h+=`<div class="lbl">ATIS ${esc(a.cs)} · ${esc(a.freq)}</div><div class="row"><span class="big">${esc(a.code||'?')}</span><span>${a.rws.length?'Piste '+esc(a.rws.join(' / ')):''} ${a.qnh?'· QNH '+esc(a.qnh):''}</span><button class="btn" data-take="${side}">Übernehmen</button></div><div class="atis">${esc(a.txt)}</div>`}
      else{h+=`<div class="lbl">ATIS</div><div class="empty">Keine VATSIM-ATIS online.${d&&d.qnh?` <button class="btn ghost" data-takeq="${side}" data-q="${esc(d.qnh)}">QNH ${esc(d.qnh)} aus METAR übernehmen</button>`:''}</div>`}
    }
    return h+'</div>'}).join('');
}

/* ---------- Flug-Formular ---------- */
function renderForm(){
  $('#sbUser').value=S.user||'';
  $('#fGrid').innerHTML=FORM.map(k=>`<label class="f">${esc(K[k].l)}<input data-k="${k}" value="${esc(F()[k])}" placeholder="—" ${K[k].num?'inputmode="numeric"':''}></label>`).join('');
  $('#f-route').value=F().route||'';
  renderVPos();
}
$('#vPos').addEventListener('click',e=>{const b=e.target.closest('[data-vcs]');if(!b)return;S.vcs=b.dataset.vcs||null;S.posNo=null;POS.prev=null;POS.vs=null;save();trackMe();head();renderVPos()});

/* ---------- Kopf & Tabs ---------- */
function head(){
  const f=F();$('#hCs').textContent=f.cs||'EFB';
  $('#hRt').textContent=f.dep?`${f.dep} → ${f.arr}${f.crz?' · '+f.crz:''}${f.squawk?' · SQ '+f.squawk:''}`:'Kein Flug geladen';
  $('#hDot').className='dot '+(V.err?'err':V.t?'on':'');
  const p=POS.p,sy=$('#sync');sy.classList.toggle('me',!!p);
  sy.textContent=p?`${altTxt(p.altitude,p.groundspeed)}${POS.vs>300?' ↑':POS.vs<-300?' ↓':''} · ${p.groundspeed} kt`
    :V.t?'VATSIM '+V.t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):V.err?'offline':'–';
}
function tab(t){
  S.tab=t;save();$$('section.tab').forEach(s=>s.classList.toggle('act',s.id==='t-'+t));$$('nav button').forEach(b=>b.classList.toggle('act',b.dataset.t===t));
  if(t==='funk')renderFunk();if(t==='check')renderCheck();if(t==='info'){renderInfo();renderOnline()}if(t==='flug')renderForm();if(t==='set')renderSet();
  $('#hSet').classList.toggle('act',t==='set');window.scrollTo(0,0);
}
function renderAll(){head();tab(S.tab)}

/* ---------- Eingabe-Dialog ---------- */
let mCb=null;
function ask(title,val,opts,num,cb){
  $('#mTitle').textContent=title;const i=$('#mInput');i.value=val||'';i.inputMode=num?'numeric':'text';
  $('#mOpts').innerHTML=(opts||[]).map(o=>`<button data-mo="${esc(o)}">${esc(o)}</button>`).join('');
  mCb=cb;$('#modal').classList.add('on');setTimeout(()=>i.focus(),30);
}
const closeM=()=>{$('#modal').classList.remove('on');mCb=null};
$('#mOk').onclick=()=>{const v=$('#mInput').value.trim().toUpperCase();const cb=mCb;closeM();cb&&cb(v)};
$('#mCancel').onclick=closeM;
$('#mInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#mOk').click();if(e.key==='Escape')closeM()});
$('#mOpts').addEventListener('click',e=>{const b=e.target.closest('[data-mo]');if(b){$('#mInput').value=b.dataset.mo;$('#mOk').click()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function editKey(k){const m=K[k]||{l:k};ask(m.l,F()[k],m.o,m.num,v=>{set(k,k==='clearedAlt'||k==='passing'||k==='crz'?lvl(v):v)})}
function set(k,v){F()[k]=v;if(k==='sid'&&v)remember(F().dep,v);save();head();if(S.tab==='funk')renderFunk();if(S.tab==='check')renderCheck()}

/* ---------- Ereignisse ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)tab(b.dataset.t)});
$('#sbLoad').onclick=loadSB;
$('#sbUser').addEventListener('keydown',e=>{if(e.key==='Enter')loadSB()});
$('#t-flug').addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.value.trim();if(k!=='route')v=v.toUpperCase();if(['crz','clearedAlt'].includes(k))v=lvl(v);F()[k]=v;if(k==='sid')remember(F().dep,v);if(['dep','arr','altn'].includes(k))pullMetar();save();head()});
$('#newFlight').onclick=()=>ask('Neuer Flug? Tippe JA','',['JA'],0,v=>{if(v==='JA'){S.f=blank();S.ck={};S.x={};S.g={p:0,c:0,done:{}};S.phase='boden';S.req=null;S.vcs=null;S.posNo=null;save();renderAll()}});
$('#phases').addEventListener('click',e=>{const b=e.target.closest('[data-ph]');if(!b)return;S.phase=b.dataset.ph;S.req=S.phase+'0';save();renderFunk()});
$('#funkBody').addEventListener('click',e=>{
  const t=e.target;let b;
  if(b=t.closest('[data-rq]')){S.req=S.phase+b.dataset.rq;save();renderFunk();return}
  if(b=t.closest('[data-sid]')){const s=b.dataset.sid;if(s==='__other')ask('SID eintragen',F().exitFix?F().exitFix.slice(0,5):'',[],0,v=>{if(v){F().clrType='sid';set('sid',v)}});else{F().clrType='sid';set('sid',s)}return}
  if(b=t.closest('[data-clr]')){const c=b.dataset.clr;if(c==='hdg')ask('Heading',F().hdg,K.hdg.o,1,v=>{F().clrType='hdg';set('hdg',v)});else{F().clrType='vec';save();renderFunk()}return}
  if(b=t.closest('[data-clrrwy]')){S.set.clrRwy=b.dataset.clrrwy==='1';save();renderFunk();return}
  if(b=t.closest('[data-cmode]')){F().climbMode=b.dataset.cmode;save();renderFunk();return}
  if(b=t.closest('[data-climb]')){const c=b.dataset.climb;if(c==='__other')ask('Freigegebene Höhe (Steigen)',F().climb,['3000','8000','FL80','FL90'],0,v=>set('climb',lvl(v)));else set('climb',c);return}
  if(b=t.closest('[data-act="takeRwy"]')){const a=atisOf(F().dep,'dep');if(a)set('depRwy',a.rwy);return}
  if(b=t.closest('[data-q]')){quick(b.dataset.q);return}
  if(b=t.closest('[data-e]')){editKey(b.dataset.e)}
});
$('#infoBody').addEventListener('click',e=>{
  let b;if(b=e.target.closest('[data-take]')){const s=b.dataset.take;const a=atisOf(s==='dep'?F().dep:F().arr,s);if(!a)return;
    if(s==='dep'){if(a.code)F().atisDep=a.code;if(a.rwy&&!a.rws.includes((F().depRwy||'').toUpperCase()))F().depRwy=a.rwy;if(a.qnh)F().qnhDep=a.qnh}else{if(a.code)F().atisArr=a.code;if(a.rwy&&!a.rws.includes((F().arrRwy||'').toUpperCase()))F().arrRwy=a.rwy;if(a.qnh)F().qnhArr=a.qnh}
    save();head();b.textContent='Übernommen ✓';return}
  if(b=e.target.closest('[data-takeq]')){F()[b.dataset.takeq==='dep'?'qnhDep':'qnhArr']=b.dataset.q;save();b.textContent='Übernommen ✓'}
});
const QUICK={sayagain:['Say again','{cs}, say again'],standby:['Standby','Nur sagen, wenn ATC dich ruft und du kurz Zeit brauchst: „{cs}, standby“'],unable:['Unable','{cs}, unable … (Grund), request …'],em:['Notfall','Squawk 7700 Notfall · 7600 Funkausfall · 7500 nur real – auf VATSIM nie. Funk: „Mayday Mayday Mayday, {cs}, …“ oder „Pan-pan Pan-pan Pan-pan, {cs}, …“']};
function quick(q){
  if(q==='sp'){S.sp=!S.sp;save();renderFunk();return}
  const[t,x]=QUICK[q];ask(t,'',[],0,()=>{});$('#mInput').style.display='none';$('#mOpts').innerHTML=`<div class="say" style="font-size:17px">${esc(x.replace('{cs}',F().cs||'Callsign'))}</div>`;
  const restore=()=>{$('#mInput').style.display=''};setTimeout(()=>{$('#mOk').addEventListener('click',restore,{once:true});$('#mCancel').addEventListener('click',restore,{once:true})},0);
}

/* ---------- Start ---------- */
if(S.tab==='karte')S.tab='funk';
if(F().climb==='VIA SID'){F().climb='';F().climbMode='sid'}  /* altes Format: „via SID“ ohne Höhe */
if(!F().dep&&S.tab!=='flug')S.tab='flug';
renderAll();
wakeSync();
pullVatsim();setInterval(pullVatsim,60000);
if(F().dep){pullMetar();setInterval(pullMetar,600000)}
}
</script>
</body>
</html>
