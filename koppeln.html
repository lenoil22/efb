<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFB Wächter koppeln</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0f16;color:#e9eef5;font:16px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:460px;padding:24px;text-align:center}
h1{font-size:22px;margin:0 0 6px}p{color:#7d8ea3;margin:0 0 18px}
#qr{display:inline-block;background:#fff;padding:16px;border-radius:14px}
code{display:block;margin-top:16px;color:#3cc8ff;word-break:break-all;font:14px ui-monospace,Consolas,monospace}
ol{text-align:left;color:#b8c6d6;font-size:14px;padding-left:20px}
</style>
</head>
<body>
<main>
  <h1>Handy koppeln</h1>
  <p>Mit der Handy-Kamera scannen und „In EFB Wächter öffnen“ wählen.</p>
  <div id="qr"></div>
  <code id="t"></code>
  <ol>
    <li>App „EFB Wächter“ muss auf dem Handy installiert sein.</li>
    <li>Kamera-App öffnen, auf den Code halten, Link antippen.</li>
    <li>Geht das nicht: In der App „Anderen Kanal eingeben“ und den blauen Kanal oben abtippen.</li>
  </ol>
</main>
<!-- Der Kanal steht nur hinter # und wird nicht an einen Server geschickt -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const t=decodeURIComponent(location.hash.slice(1));
document.getElementById('t').textContent=t||'Kein Kanal – bitte über die EFB Bridge öffnen.';
if(t&&window.QRCode)new QRCode(document.getElementById('qr'),{text:'efbwaechter://pair?topic='+encodeURIComponent(t),width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
</script>
</body>
</html>
