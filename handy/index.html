<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<title>EFB Wächter</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Handy-Oberfläche der Android-App „EFB Wächter“ (läuft in deren WebView, Fenster: window.EFBApp).
   Im normalen Browser: Status + Weg/Zurück über ntfy (Kanal hinter #), Flugdaten von VATSIM.
   Design: siehe Vault „EFB Wächter Design“ – Systemschrift für Text, B612 Mono für Zahlen,
   Cyan = Aktion, Grün = Daten/OK, Orange = TOD/Weg, Rot = Warnung; Tab-Leiste als Material. */
:root{
  --bg:#0A0E13;--s1:#121820;--s2:#19212B;--s3:#222C38;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --t1:#EEF2F7;--t2:#A3B1C2;--t3:#6E7D90;
  --cyan:#4CC9F0;--green:#3DDC97;--amber:#FFB547;--red:#FF5D5D;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --mono:"B612 Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--t1);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(18px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));min-height:100vh;transition:background .4s ease}
body.away{background:radial-gradient(120% 50% at 50% 0%,rgba(255,181,71,.15),transparent 60%),var(--bg) no-repeat}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:15px var(--mono);background:var(--s2);color:var(--t1);border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px;width:100%;min-height:46px}
input:focus{outline:2px solid var(--cyan);outline-offset:1px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}
/* Kopf */
.lt{font-size:31px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.eyebrow{font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px;min-height:28px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:12px;color:var(--t2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.pill.ok i{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.pill.warn i{background:var(--amber)}
.pill.live{color:var(--green);border-color:rgba(61,220,151,.28)}
/* Karten und Abschnitte */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card+.card{margin-top:12px}
.sec{margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec span{font-size:12px;color:var(--t3);text-align:right}
.sub{font-size:13px;color:var(--t2)}
.note{font-size:12px;color:var(--t3);margin:8px 4px 0;line-height:1.5}
/* Knöpfe */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:var(--r-md);font-weight:700;font-size:18px;letter-spacing:-.01em;transition:transform .1s ease-out,opacity .15s}
.cta:active{transform:scale(.97)}
.cta svg{width:22px;height:22px}
.cta.go{background:var(--cyan);color:#03131B}
.cta.back{background:var(--green);color:#03170E;min-height:68px;font-size:20px}
.cta:disabled{opacity:.35}
.hint{font-size:13px;color:var(--t2);text-align:center;margin-top:10px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border:1px solid var(--line2);border-radius:var(--r-md);color:var(--cyan);font-weight:600;font-size:15px;transition:transform .1s}
.ghost:active{transform:scale(.98)}
.btn-s{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(76,201,240,.4);color:var(--cyan);font-size:13px;font-weight:600}
/* Weg-Modus */
.ring{position:relative;width:200px;height:200px;margin:4px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .6s ease}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font:700 54px/1 var(--mono);letter-spacing:-.03em;color:var(--amber)}
.ring .c span{font-size:13px;color:var(--t2);margin-top:6px}
.ring.over .c b{color:var(--red)}
/* Flug */
.flt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.flt .cs{font:700 15px var(--mono)}
.flt .rt{font-size:13px;color:var(--t2);flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s3);color:var(--t1);white-space:nowrap}
.inst{display:grid;grid-template-columns:1.15fr 1fr .95fr;gap:2px;background:var(--line);border-radius:var(--r-md);overflow:hidden}
.inst div{background:var(--s1);padding:12px 12px 10px}
.inst b{display:block;font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.06em}
.inst span{display:block;font:700 26px/1.1 var(--mono);color:var(--green);letter-spacing:-.02em;margin-top:4px}
.inst span.n{color:var(--t1)}
.inst small{font:600 12px var(--mono);color:var(--t3)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--s2);border-radius:var(--r-md);padding:12px}
.tile b{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--t3)}
.tile .big{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .big.amber{color:var(--amber)}
.tile .sm{font:12px var(--mono);color:var(--t2);margin-top:2px}
.track{position:relative;height:34px;margin:14px 4px 0}
.track .line{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--s3)}
.track .done{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--green))}
.track .me{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;color:var(--t1);transform:rotate(90deg)}
.track .tod{position:absolute;top:5px;width:2px;height:12px;background:var(--amber)}
.track .lbl{position:absolute;top:22px;font:11px var(--mono);color:var(--t3);transform:translateX(-50%)}
.track .lbl.l{transform:none;left:0}.track .lbl.r{transform:none;right:0}
/* Lotsen-Zeitleiste */
.atc{position:relative;padding-left:42px}
.atc:before{content:"";position:absolute;left:21px;top:30px;bottom:30px;width:2px;background:var(--s3)}
.st{position:relative;padding:8px 0 12px}
.st:before{content:"";position:absolute;left:-26px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--s1);border:2px solid var(--t3)}
.st.now:before{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.st.next:before{border-color:var(--cyan)}
.st small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--t3);text-transform:uppercase}
.st .n{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px}
.st .n span{font-size:15px;font-weight:600}
.st .f{font:700 19px var(--mono);color:var(--green);white-space:nowrap}
.st.next .f{color:var(--cyan)}
.st .x{font:12px var(--mono);color:var(--t3);margin-top:1px}
.dest{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dest .chip{background:var(--s2);font-weight:500}.dest .chip em{font-style:normal;font-family:var(--mono);color:var(--green)}
/* Listen (Alarme, Verlauf, Einrichtung) */
.list{padding:2px 16px}
.it{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.it:first-child{border-top:0}
button.it:active{opacity:.7}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px}
.ic.c{background:rgba(76,201,240,.14);color:var(--cyan)}.ic.a{background:rgba(255,181,71,.14);color:var(--amber)}
.ic.r{background:rgba(255,93,93,.14);color:var(--red)}.ic.g{background:rgba(61,220,151,.14);color:var(--green)}.ic.n{background:rgba(163,177,194,.12);color:var(--t2)}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px;font-weight:600}.it .tx span{display:block;font-size:12px;color:var(--t2)}
.it .v{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:4px;text-align:right}
.it .v svg{width:14px;height:14px;color:var(--t3);flex:none;transition:transform .2s}
.it.open .v svg{transform:rotate(90deg)}
.it .v.w{color:var(--amber)}
.it .tm{font:12px var(--mono);color:var(--t3);white-space:nowrap}
.pick{margin:0 0 10px 46px;background:var(--s2);border-radius:var(--r-sm);overflow:hidden}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:6px 14px;border-top:1px solid var(--line);font-size:14px;text-align:left}
.opt:first-child{border-top:0}.opt:active{background:var(--s3)}
.opt em{display:block;font-style:normal;font-size:12px;color:var(--t3)}
.opt.on{color:var(--cyan)}.opt svg{width:18px;height:18px;flex:none}
.ok{color:var(--green)}.no{color:var(--amber)}
/* Tab-Leiste: Material, Inhalt scrollt darunter */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(10,14,19,.74);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;justify-content:center;font-size:11px;font-weight:600;color:var(--t3)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--cyan)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
/* Steuern (Fernbedienung) */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;padding:8px;border-radius:var(--r-md);background:var(--s2);font-size:14px;font-weight:600;text-align:center;transition:transform .1s ease-out}
.cbtn:active{transform:scale(.97)}
.cbtn svg{width:22px;height:22px;color:var(--cyan)}
.cbtn small{font-size:11px;font-weight:500;color:var(--t3)}
.cbtn.on{background:rgba(255,181,71,.14);color:var(--amber)}.cbtn.on svg{color:var(--amber)}
.cbtn:disabled{opacity:.4}
/* Verlauf: Nachrichtentext */
.it .tx .msg{color:var(--t1);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.it.full .tx .msg{-webkit-line-clamp:unset;display:block}
.it .tx .meta{font-size:11px;color:var(--t3);margin-top:2px}
.rbtn{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:rgba(76,201,240,.14);color:var(--cyan);font-size:13px;font-weight:600}
/* Antwort-Blatt */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);animation:fade .18s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--s1);border-top:1px solid var(--line2);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .26s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.sheet .said{background:var(--s2);border-radius:var(--r-md);padding:12px 14px;font:14px/1.5 var(--mono);margin:8px 0 14px;word-break:break-word}
.qr{display:flex;align-items:center;width:100%;min-height:50px;padding:0 14px;border-radius:var(--r-sm);background:var(--s2);font-size:15px;font-weight:600;margin-top:8px;text-align:left}
.qr:active{background:var(--s3)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;transform:translateX(-50%);background:var(--s3);color:var(--t1);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:fade .15s ease-out;white-space:nowrap}
/* Logbuch */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);border-radius:var(--r-md);overflow:hidden}
.sum div{background:var(--s1);padding:12px}
.sum b{display:block;font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.06em}
.sum span{display:block;font:700 22px/1.15 var(--mono);margin-top:4px;letter-spacing:-.02em}
.fpm{flex:none;width:64px;text-align:center;font:700 17px/1.1 var(--mono);letter-spacing:-.02em}
.fpm small{display:block;font:600 10px system-ui,sans-serif;letter-spacing:.02em;margin-top:2px}
.g-butterweich{color:var(--green)}.g-gut{color:var(--cyan)}.g-fest{color:var(--amber)}.g-hart{color:var(--red)}
.lbd{margin:0 0 10px 76px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--t2)}
.lbd em{font-style:normal;font-family:var(--mono);color:var(--t1)}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--s3);transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--green)}.sw.on:after{transform:translateX(20px)}
section{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency:reduce){.tabs{background:var(--bg);backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:fade .15s ease-out!important}}
</style>
</head>

  <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m9 6 6 6-6 6"/></symbol>

  <symbol id="i-sq" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 12h.01M11 12h.01M15 12h.01"/></g></symbol>

<!-- ===================== FLUG ===================== -->
<section id="t-flug">
  <div class="lt" id="fTitle">Flug</div>
  <div class="pills" id="pills"></div>

  <div id="setup" class="card hide">
    <p style="margin-bottom:8px;font-weight:600">Noch nicht mit dem PC gekoppelt</p>
    <p class="sub">Am PC: Symbol der EFB Bridge → Rechtsklick → <b>Handy koppeln</b> → QR-Code mit der Handy-Kamera scannen. Oder den Kanal hier einfügen:</p>
    <div style="display:flex;gap:8px;margin-top:12px"><input id="topicIn" placeholder="efb-…" autocomplete="off" autocapitalize="off" aria-label="Kanal"><button class="btn-s" id="topicSave">Koppeln</button></div>
  </div>

  <div id="main" class="hide">
    <div id="awayCard"></div>

    <div class="sec"><span class="eyebrow">Jetzt</span><span id="fdSrc"></span></div>
    <div class="card" id="fd"><p class="sub">Lädt …</p></div>

    <div id="ctlWrap"></div>

    <div class="sec"><span class="eyebrow">Lotsen</span><span>VATSIM</span></div>
    <div class="card atc" id="atc"><p class="sub">Lädt …</p></div>
  </div>
</section>

<!-- ===================== FLÜGE (Logbuch) ===================== -->
<section id="t-fluege" class="hide">
  <div class="lt">Flüge</div>
  <div id="lbBody"></div>
</section>

<!-- ===================== ALARME ===================== -->
<section id="t-alarme" class="hide">
  <div class="lt">Alarme</div>
  <div id="alarmBody"></div>
</section>

<!-- ===================== VERLAUF ===================== -->
<section id="t-verlauf" class="hide">
  <div class="lt">Verlauf</div>
  <p class="note">Alle Meldungen vom PC, neueste oben.</p>
  <div class="card list" id="hist" style="margin-top:14px"></div>
</section>

<nav class="tabs" aria-label="Bereiche">
  <button class="tab on" data-tab="flug"><svg><use href="#i-plane"/></svg>Flug</button>
  <button class="tab" data-tab="fluege"><svg><use href="#i-book"/></svg>Flüge</button>
  <button class="tab" data-tab="alarme"><svg><use href="#i-bell"/></svg>Alarme</button>
  <button class="tab" data-tab="verlauf"><svg><use href="#i-list"/></svg>Verlauf<i class="badge hide" id="badge"></i></button>
</nav>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APP=window.EFBApp||null;
/* Alarmarten: Name, Symbol, Farbe, Gruppe */
const KIND={tod:['Top of Descent','i-down','a','Flug'],sector:['Neuer Lotse voraus','i-radio','c','Flug'],away:['Weg-Modus abgelaufen','i-clock','n','Flug'],
  warning:['Master Warning','i-warn','r','Cockpit'],ap:['Autopilot aus','i-plane','r','Cockpit'],caution:['Master Caution','i-warn','a','Cockpit'],pause:['Sim pausiert','i-pause','n','Cockpit'],
  fuel:['Sprit unter Plan','i-fuel','a','Flug'],landing:['Gelandet (Aufsetzrate)','i-land','g','Flug'],
  crash:['Sim antwortet nicht','i-warn','r','Cockpit'],
  contact:['Lotse schreibt dir','i-chat','c','VATSIM'],vatsim:['Von VATSIM getrennt','i-link','r','VATSIM'],atis:['ATIS & Rückmeldungen','i-cloud','n','VATSIM'],
  test:['Test vom PC','i-info','n','Sonstiges'],info:['Infos (Bridge gestartet …)','i-info','n','Sonstiges']};
const SUBS={sector:'5 min vorher',away:'nach 25 min',fuel:'gegen SimBrief',crash:'in der Luft, 20 s keine Daten',contact:'Nachricht, SELCAL, Funk-Text an dich',vatsim:'nur in der Luft',atis:'neue ATIS am Ziel, Antworten'};
/* Schnell-Antworten an den Lotsen (gleich wie in der App-Benachrichtigung) */
const QUICK=['Roger','Back at the controls in 2 min','Wilco','Stand by, back in 5 min'];
/* 2 = Wecker nur im Weg-Modus, sonst Nachricht (am PC hört man es ja selbst) */
const MODES=[['Aus',''],['Nachricht','Banner und Ton'],['Wecker, wenn weg','sonst Nachricht'],['Immer Wecker','']];
const NTFY='https://ntfy.sh';
let S={topic:'',modes:{},history:[],status:null,connected:false,fsi:true,battery:true,notif:true,lan:false,logbook:[]};
let TAB=localStorage.getItem('efb.tab')||'flug',OPEN='',LBOPEN='',SHEET=null,PAUSED=null,SND=null;
const URGENT=['warning','crash','vatsim','ap'];
const TABS=['flug','fluege','alarme','verlauf'];if(!TABS.includes(TAB))TAB='flug';

/* ---------- Zustand: aus der App oder (Browser) aus ntfy ---------- */
function load(){
  if(APP){try{S=JSON.parse(APP.state())}catch(e){}}
  else{S.topic=decodeURIComponent(location.hash.slice(1))||localStorage.getItem('efb.topic')||''}
  render();
}
window.efbUpdate=load;
let es=null;
function browserListen(){
  if(APP||!S.topic||es)return;
  localStorage.setItem('efb.topic',S.topic);
  es=new EventSource(`${NTFY}/${encodeURIComponent(S.topic)}-status/sse?since=12h`);
  es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==='message'){S.status={...JSON.parse(m.message),rx:m.time*1000};S.connected=true;render()}}catch(err){}};
  es.onerror=()=>{S.connected=false;render()};
}
function send(cmd){
  if(APP){APP.send(cmd);return}
  fetch(`${NTFY}/${encodeURIComponent(S.topic)}-cmd`,{method:'POST',body:cmd}).catch(()=>{});
}
let toastT=0;
function toast(t){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=t;el.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.add('hide'),2200)}

/* ---------- Anzeige ---------- */
const hm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const icon=(id,cls)=>`<span class="ic ${cls}"><svg><use href="#${id}"/></svg></span>`;
function render(){
  for(const t of TABS){$('#t-'+t).classList.toggle('hide',TAB!==t);document.querySelector(`[data-tab="${t}"]`).classList.toggle('on',TAB===t)}
  $('#setup').classList.toggle('hide',!!S.topic);
  $('#main').classList.toggle('hide',!S.topic);
  const st=S.status||{},pcOn=!!st.on&&S.connected!==false;
  document.body.classList.toggle('away',!!st.away);
  $('#fTitle').textContent=st.away?'Du bist weg':'Flug';
  // Status-Pillen
  const pill=(ok,txt,cls)=>`<span class="pill ${cls||(ok?'ok':'')}"><i></i>${txt}</span>`;
  $('#pills').innerHTML=!S.topic?'':!S.connected?pill(false,'Verbindet …','warn'):
    pill(pcOn,pcOn?'PC verbunden':'PC-Bridge aus')+(pcOn?pill(st.sim,st.sim?'Sim':'Sim wartet')+(st.sim?pill(st.fenix,st.fenix?'Fenix':'Fenix nicht geladen'):''):'')+(S.lan?pill(true,'WLAN live','ok live'):'');
  // Weg-Modus oder „Ich bin weg“
  if(st.away){
    const gone=Math.max(0,(Date.now()-st.awaySince)/60000),tot=st.awayMin||25,left=tot-gone,frac=Math.max(0,Math.min(1,left/tot));
    $('#awayCard').innerHTML=`<div class="ring${left<=0?' over':''}"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#222C38" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="${left<=0?'#FF5D5D':'#FFB547'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="${(326.7*(1-frac)).toFixed(1)}"/></svg>`+
      `<div class="c"><b>${left>0?Math.ceil(left):'0'}</b><span>${left>0?'min bis zum Wecker':'Zeit abgelaufen'}</span></div></div>`+
      `<p class="hint" style="margin:0 0 4px">${Math.floor(gone)} min weg · VATSIM erlaubt max. 30</p>`+
      `<div class="sec"><span class="eyebrow">Was als Nächstes kommt</span></div><div class="card list" id="awayNext"><div class="it"><div class="tx"><span>Wird berechnet …</span></div></div></div>`+
      `<div style="height:14px"></div><button class="cta back" data-cmd="da"><svg><use href="#i-check"/></svg>Bin zurück</button>`;
    window.efbAwayNext&&window.efbAwayNext();
  }else{
    $('#awayCard').innerHTML=`<div class="card"><button class="cta go" data-cmd="weg" ${pcOn?'':'disabled'}><svg><use href="#i-walk"/></svg>Ich bin weg</button>`+
      `<p class="hint">${pcOn?`Wecker nach ${st.awayMin||25} min · VATSIM erlaubt max. 30`:'Geht, sobald die PC-Bridge läuft.'}</p></div>`;
  }
  renderCtl(st,pcOn);renderAlarme();renderVerlauf();renderLog();renderSheet();renderSound();
}
/* Steuern vom Handy: Sim-Pause (FSUIPC), IDENT + ATIS/METAR über das vPilot-Plugin */
function renderCtl(st,pcOn){
  const el=$('#ctlWrap');if(!el)return;
  if(!pcOn){el.innerHTML='';return}
  const paused=PAUSED!=null&&Date.now()-PAUSED.t<6000?PAUSED.on:!!st.paused,vp=!!st.vp,arr=st.arr||'';
  const b=(cmd,ic,t,sub,dis,on)=>`<button class="cbtn${on?' on':''}" data-rc="${esc(cmd)}" ${dis?'disabled':''}><svg><use href="#${ic}"/></svg>${t}${sub?`<small>${sub}</small>`:''}</button>`;
  el.innerHTML=`<div class="sec"><span class="eyebrow">Steuern</span><span>${vp?'vPilot verbunden':'vPilot-Plugin fehlt'}</span></div><div class="card"><div class="ctl">`+
    (paused?b('resume','i-play','Sim weiter','läuft gerade nicht',!st.sim,true):b('pause','i-pause','Sim pausieren','',!st.sim))+
    b('ident','i-sq','IDENT','Transponder',!vp)+
    b('atis:'+arr,'i-radio','ATIS '+esc(arr||'Ziel'),'abfragen',!vp||!arr)+
    b('metar:'+arr,'i-cloud','METAR '+esc(arr||'Ziel'),'abfragen',!vp||!arr)+
    `</div>${vp?'':'<p class="note">IDENT, ATIS und METAR brauchen das EFB-Plugin in vPilot (bridge/vpilot/build.bat).</p>'}</div>`;
}
function renderAlarme(){
  if(!APP){$('#alarmBody').innerHTML='<p class="note" style="margin-top:12px">Alarme einstellen geht in der App „EFB Wächter“ auf dem Handy.</p>';return}
  let h='<p class="note">Am PC bekommst du eine Nachricht, im Weg-Modus klingelt der Wecker. Pro Alarm einstellbar.</p>';
  const all=S.sounds&&S.sounds['*'];
  if(all)h+=`<div class="sec"><span class="eyebrow">Weckerton</span></div><div class="card list"><button class="it" data-snd="*">${icon('i-music','c')}<div class="tx"><b>Für alle Alarme</b><span>Warnungen haben eigene Töne, wenn du willst</span></div><span class="v">${esc(all.name)}<svg><use href="#i-chev"/></svg></span></button></div>`;
  for(const g of['Flug','Cockpit','VATSIM','Sonstiges']){
    h+=`<div class="sec"><span class="eyebrow">${g}</span></div><div class="card list">`;
    for(const[k,v]of Object.entries(KIND)){if(v[3]!==g)continue;const m=S.modes[k]??0,open=OPEN===k;
      h+=`<button class="it${open?' open':''}" data-open="${k}" aria-expanded="${open}">${icon(v[1],v[2])}<div class="tx"><b>${esc(v[0])}</b>${SUBS[k]?`<span>${SUBS[k]}</span>`:''}</div><span class="v${m>=2?' w':''}">${MODES[m][0]}<svg><use href="#i-chev"/></svg></span></button>`;
      if(open){const sd=S.sounds&&S.sounds[k];
        h+=`<div class="pick" role="radiogroup">${MODES.map(([t,d],i)=>`<button class="opt${i===m?' on':''}" role="radio" aria-checked="${i===m}" data-k="${k}" data-m="${i}"><span>${t}${d?`<em>${d}</em>`:''}</span>${i===m?'<svg><use href="#i-check"/></svg>':''}</button>`).join('')}</div>`+
          (sd&&m>=2?`<div class="pick"><button class="opt" data-snd="${k}"><span>Weckerton<em>${esc(sd.name)} · ${sndHow(k)}</em></span><svg style="color:var(--t3)"><use href="#i-chev"/></svg></button></div>`:'');}
    }
    h+='</div>';
  }
  h+='<div style="height:12px"></div><button class="ghost" id="testW"><svg width="18" height="18"><use href="#i-bell"/></svg>Wecker testen</button>';
  const fx=[[S.notif,'Benachrichtigungen','notif'],[S.fsi,'Vollbild-Wecker','fsi'],[S.battery,'Läuft im Hintergrund (Akku-Optimierung aus)','battery']];
  if(S.liveNotif!=null)h+=`<div class="sec"><span class="eyebrow">Sperrbildschirm</span></div><div class="card list"><button class="it" id="liveSw" role="switch" aria-checked="${!!S.liveNotif}">${icon('i-down','a')}<div class="tx"><b>Live-Status im Flug</b><span>TOD und ETA als Countdown (nur im WLAN)</span></div><span class="sw${S.liveNotif?' on':''}"></span></button></div>`;
  h+=`<div class="sec"><span class="eyebrow">Einrichtung</span></div><div class="card list">`+fx.map(([ok,t,a])=>`<div class="it">${icon(ok?'i-check':'i-warn',ok?'g':'a')}<div class="tx"><b>${t}</b><span>${ok?'erlaubt':'noch nicht erlaubt'}</span></div>${ok?'':`<button class="btn-s" data-fix="${a}">Erlauben</button>`}</div>`).join('')+`</div>`;
  h+=`<div class="sec"><span class="eyebrow">Kopplung</span></div><div class="card list"><div class="it">${icon('i-link','c')}<div class="tx"><b>PC-Kanal</b><span class="num" style="word-break:break-all">${esc(S.topic)}</span></div></div></div>`+
     `<div style="height:10px"></div><button class="ghost" id="unpair" style="color:var(--t2)">Anderen Kanal eingeben</button>`;
  $('#alarmBody').innerHTML=h;
}
function renderVerlauf(){
  const h=(S.history||[]).slice(-40).reverse();
  $('#hist').innerHTML=h.length?h.map(x=>{const v=KIND[x.kind]||KIND.info,how=x.mode===2?'als Wecker':x.mode===1?'als Nachricht':'nur im Verlauf';
    const msg=x.msg&&['contact','atis','landing','fuel','crash','vatsim','sector','tod'].includes(x.kind)?`<span class="msg">${esc(x.msg)}</span>`:'';
    return`<div class="it" data-hid="${esc(x.id)}">${icon(v[1],v[2])}<div class="tx"><b>${esc(x.title)}</b>${msg}<span class="meta">${how}</span></div>`+
      (x.from?`<button class="rbtn" data-reply="${esc(x.id)}">Antworten</button>`:`<span class="tm">${hm(x.t)}</span>`)+'</div>'}).join('')
    :'<div class="it"><div class="tx"><span>Noch keine Meldungen.</span></div></div>';
  const seen=+localStorage.getItem('efb.seen')||0,neu=(S.history||[]).filter(x=>x.t>seen&&x.kind!=='info').length;
  const b=$('#badge');b.textContent=neu>9?'9+':neu;b.classList.toggle('hide',!neu||TAB==='verlauf');
  if(TAB==='verlauf')localStorage.setItem('efb.seen',Date.now());
}
/* Weckerton wählen: eingebaute Töne, Ton vom Handy, eigene Datei. Antippen spielt ihn kurz an. */
function sndHow(k){const st=S.sounds[k].set;return st==='inherit'||(st===''&&!URGENT.includes(k))?'wie alle':st===''?'Standard':'eigener Ton'}
function renderSound(){
  let el=$('#sndWrap');if(!el){el=document.createElement('div');el.id='sndWrap';document.body.appendChild(el)}
  if(!SND||!S.sounds){el.innerHTML='';return}
  const k=SND,cur=S.sounds[k],inh=k!=='*'&&(cur.set==='inherit'||(cur.set===''&&!URGENT.includes(k)));
  const B=S.builtin||[],isB=B.some(b=>b.uri===cur.uri);
  const row=(attrs,name,sub,on)=>`<button class="opt${on?' on':''}" role="radio" aria-checked="${on}" ${attrs}><span>${esc(name)}${sub?`<em>${esc(sub)}</em>`:''}</span><svg${on?'':' style="color:var(--t3)"'}><use href="#${on?'i-check':'i-play'}"/></svg></button>`;
  let h='';
  if(k!=='*')h+=row(`data-su="inherit" data-sn=""`,'Wie alle Alarme',S.sounds['*'].name,inh);
  h+=B.map(b=>row(`data-su="${esc(b.uri)}" data-sn="${esc(b.name)}"`,b.name,b.name==='Dringend'?'für Warnungen':b.name==='Glocke (sanft)'?'zum Wachwerden':'',!inh&&b.uri===cur.uri)).join('');
  if(!inh&&!isB)h+=row(`data-su="${esc(cur.uri)}" data-sn="${esc(cur.name)}"`,cur.name,'vom Handy / eigene Datei',true);
  el.innerHTML=`<div class="scrim" data-sclose></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Weckerton"><div class="grab"></div>`+
    `<div class="eyebrow">Weckerton · ${k==='*'?'alle Alarme':esc((KIND[k]||KIND.info)[0])}</div><p class="note" style="margin:4px 0 10px">Antippen wählt den Ton und spielt ihn kurz an (Wecker-Lautstärke).</p>`+
    `<div class="pick" style="margin:0" role="radiogroup">${h}</div><div style="height:10px"></div>`+
    `<button class="qr" data-spick="sys">${icon('i-bell','n')}<span style="margin-left:12px">Ton vom Handy …</span></button>`+
    `<button class="qr" data-spick="file">${icon('i-music','n')}<span style="margin-left:12px">Eigene Datei (MP3, WAV) …</span></button>`+
    `<div style="height:12px"></div><button class="cta go" data-sclose style="min-height:52px;font-size:16px">Fertig</button></div>`;
}
function closeSound(){SND=null;APP&&APP.stopPreview&&APP.stopPreview();renderSound()}
/* Antwort an den Lotsen (Privatnachricht über vPilot) */
function renderSheet(){
  let el=$('#sheetWrap');if(!el){el=document.createElement('div');el.id='sheetWrap';document.body.appendChild(el)}
  if(!SHEET){el.innerHTML='';return}
  if(el.dataset.for===SHEET.id&&el.innerHTML)return;     // Eingabe nicht bei jedem Update verlieren
  el.dataset.for=SHEET.id;
  el.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Antwort an ${esc(SHEET.from)}"><div class="grab"></div>`+
    `<div class="eyebrow">${esc(SHEET.title)} · ${hm(SHEET.t)}</div><div class="said">${esc(SHEET.msg)}</div>`+
    `<div class="eyebrow">Antworten an ${esc(SHEET.from)}</div>`+QUICK.map(q=>`<button class="qr" data-q="${esc(q)}">${esc(q)}</button>`).join('')+
    `<div style="display:flex;gap:8px;margin-top:12px"><input id="replyIn" maxlength="240" placeholder="Eigene Antwort …" autocomplete="off" aria-label="Eigene Antwort"><button class="btn-s" id="replySend">Senden</button></div>`+
    `<p class="note">Geht als Privatnachricht über vPilot an ${esc(SHEET.from)}.</p><div style="height:6px"></div><button class="ghost" data-close style="color:var(--t2)">Schließen</button></div>`;
}
function reply(text){
  text=String(text||'').trim();if(!SHEET||!text)return;
  send(`pm:${SHEET.from}:${text}`);toast('Gesendet an '+SHEET.from);SHEET=null;renderSheet();
}
/* Logbuch: vergangene Flüge mit Aufsetzrate (kommt per WLAN vom PC, in der App gespeichert) */
const dur=ms=>{const m=Math.round(ms/60000);return`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};
function renderLog(){
  const el=$('#lbBody');if(!el)return;
  if(!APP){el.innerHTML='<p class="note" style="margin-top:12px">Das Logbuch gibt es in der App „EFB Wächter“ (kommt per WLAN vom PC).</p>';return}
  const L=(S.logbook||[]).filter(f=>f.fpm!=null);
  if(!L.length){el.innerHTML='<div class="card" style="margin-top:14px"><p class="sub">Noch keine Flüge. Nach der Landung und 30 s Stillstand am Stand trägt die PC-Bridge den Flug ein – mit Aufsetzrate, G-Last und Flugzeit.</p></div>'+(S.lan?'':'<p class="note">Das Logbuch kommt, wenn das Handy im selben WLAN wie der PC ist.</p>');return}
  const avg=Math.round(L.reduce((a,f)=>a+Math.abs(f.fpm),0)/L.length),best=L.reduce((a,f)=>Math.abs(f.fpm)<Math.abs(a.fpm)?f:a,L[0]);
  const air=L.reduce((a,f)=>a+(f.landing&&f.takeoff?f.landing-f.takeoff:0),0);
  let h=`<div class="sum" style="margin-top:14px"><div><b>FLÜGE</b><span>${L.length}</span></div><div><b>Ø LANDUNG</b><span>-${avg}</span></div><div><b>BESTE</b><span class="g-${esc(best.grade)}">${best.fpm}</span></div></div>`+
    `<p class="note">${dur(air)} h in der Luft · Aufsetzrate in ft/min</p><div class="sec"><span class="eyebrow">Letzte Flüge</span></div><div class="card list">`;
  for(const f of L){
    const open=LBOPEN===f.id,d=new Date(f.landing||f.offBlock||Date.parse(f.date));
    const day=d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
    h+=`<button class="it${open?' open':''}" data-lb="${esc(f.id)}" aria-expanded="${open}"><span class="fpm g-${esc(f.grade)}">${f.fpm}<small>${esc(f.grade)}</small></span>`+
      `<div class="tx"><b>${esc(f.dep||'?')} → ${esc(f.arr||'?')}</b><span>${[f.cs,f.type,day,f.takeoff&&f.landing?dur(f.landing-f.takeoff)+' h':''].filter(Boolean).map(esc).join(' · ')}</span></div>`+
      `<span class="v">${f.g!=null?f.g.toFixed(2)+' G':''}<svg><use href="#i-chev"/></svg></span></button>`;
    if(open){
      const t=x=>x?hm(x):'–',used=f.fuelOutLbs!=null&&f.fuelInLbs!=null?Math.round((f.fuelOutLbs-f.fuelInLbs)*0.453592):null;
      h+=`<div class="lbd"><span>Off-Block</span><em>${t(f.offBlock)}</em><span>Start</span><em>${t(f.takeoff)}</em><span>Landung</span><em>${t(f.landing)}</em><span>On-Block</span><em>${t(f.onBlock)}</em>`+
        `${f.offBlock&&f.onBlock?`<span>Blockzeit</span><em>${dur(f.onBlock-f.offBlock)} h</em>`:''}${used!=null&&used>0?`<span>Sprit</span><em>${used.toLocaleString('de-DE')} kg</em>`:''}`+
        `<span>Aufsetzen</span><em>${f.fpm} fpm · ${f.g!=null?f.g.toFixed(2):'–'} G${f.bounces?' · '+f.bounces+'× gesprungen':''}</em></div>`;
    }
  }
  el.innerHTML=h+'</div>';
}
setInterval(()=>{if(S.status&&S.status.away)render()},15000);

/* ---------- Bedienung ---------- */
document.addEventListener('click',e=>{
  let b;
  if(b=e.target.closest('[data-tab]')){TAB=b.dataset.tab;localStorage.setItem('efb.tab',TAB);OPEN='';render();window.scrollTo(0,0);return}
  if(b=e.target.closest('[data-rc]')){if(b.disabled)return;const c=b.dataset.rc;send(c);
    if(c==='pause'||c==='resume'){PAUSED={on:c==='pause',t:Date.now()};renderCtl(S.status||{},true)}
    toast(c==='pause'?'Sim wird pausiert':c==='resume'?'Sim läuft weiter':c==='ident'?'IDENT gesendet':'Abfrage gesendet – Antwort kommt als Meldung');return}
  if(b=e.target.closest('[data-snd]')){SND=b.dataset.snd;renderSound();return}
  if(b=e.target.closest('[data-su]')){const u=b.dataset.su;if(!APP)return;APP.setSound(SND,u,b.dataset.sn);
    if(u!=='inherit')APP.preview(u);else APP.preview(S.sounds['*'].uri);load();return}
  if(b=e.target.closest('[data-spick]')){if(APP)b.dataset.spick==='sys'?APP.pickSystem(SND):APP.pickFile(SND);return}
  if(e.target.closest('[data-sclose]')){closeSound();return}
  if(b=e.target.closest('[data-reply]')){const x=(S.history||[]).find(h=>h.id===b.dataset.reply);if(x){SHEET={id:x.id,from:x.from,title:x.title,msg:x.msg,t:x.t};renderSheet()}return}
  if(b=e.target.closest('[data-q]')){reply(b.dataset.q);return}
  if(e.target.closest('#replySend')){reply($('#replyIn').value);return}
  if(e.target.closest('[data-close]')){SHEET=null;renderSheet();return}
  if(b=e.target.closest('[data-lb]')){LBOPEN=LBOPEN===b.dataset.lb?'':b.dataset.lb;renderLog();return}
  if(b=e.target.closest('[data-hid]')){b.classList.toggle('full');return}
  if(e.target.closest('#liveSw')){S.liveNotif=!S.liveNotif;APP&&APP.setLiveNotif&&APP.setLiveNotif(S.liveNotif);renderAlarme();return}
  if(b=e.target.closest('[data-cmd]')){if(b.disabled)return;send(b.dataset.cmd);S.status=S.status||{};S.status.away=b.dataset.cmd==='weg';S.status.awaySince=Date.now();render();window.scrollTo(0,0);return}
  if(b=e.target.closest('[data-open]')){OPEN=OPEN===b.dataset.open?'':b.dataset.open;renderAlarme();return}
  if(b=e.target.closest('[data-k]')){APP&&APP.setMode(b.dataset.k,+b.dataset.m);S.modes[b.dataset.k]=+b.dataset.m;OPEN='';renderAlarme();return}
  if(b=e.target.closest('[data-fix]')){const a=b.dataset.fix;APP&&(a==='fsi'?APP.openFsi():a==='battery'?APP.openBattery():APP.openNotif());return}
  if(e.target.closest('#testW')){APP&&APP.testAlarm('test');return}
  if(e.target.closest('#topicSave')){const t=$('#topicIn').value.trim();if(!/^efb-[a-z0-9]{8,}$/i.test(t)){alert('Das sieht nicht wie ein Kanal aus (efb-…).');return}
    if(APP)APP.setTopic(t);else{location.hash=t;S.topic=t;browserListen()}TAB='flug';load();return}
  if(e.target.closest('#unpair')){if(APP)APP.setTopic('');else{location.hash='';localStorage.removeItem('efb.topic');S.topic=''}TAB='flug';load();return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='replyIn')reply(e.target.value);if(e.key==='Escape'&&SHEET){SHEET=null;renderSheet()}if(e.key==='Escape'&&SND)closeSound()});
window.efbStatus=()=>S.status;
load();browserListen();
}
</script>

<script>
/* ---------- Flugdaten live: SimBrief-Plan + VATSIM-Feed + VATSpy-Sektoren ----------
   Gleiche Logik wie im iPad-EFB („Wo bin ich?“ A3, „Nächste Frequenz“ A4), hier kompakt fürs Handy.
   Der SimBrief-Name kommt von der PC-Bridge (Status „sb“) oder wird hier eingetragen. */
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FD={plan:null,planErr:'',sbLoaded:'',p:null,vs:null,prev:null,ctl:[],atis:[],t:0,err:false};
const sbName=()=>{const st=window.efbStatus&&window.efbStatus();return(localStorage.getItem('efb.sb')||st&&st.sb||'').trim()};

/* SimBrief: Callsign, Plätze, Route, TOD-Punkt */
async function loadPlan(){
  const u=sbName();if(!u){FD.plan=null;FD.planErr='';return}
  try{
    const j=await(await fetch('https://www.simbrief.com/api/xml.fetcher.php?json=1&username='+encodeURIComponent(u))).json();
    if(j.fetch&&j.fetch.status&&j.fetch.status!=='Success')throw new Error(j.fetch.status);
    let fx=j.navlog?.fix||[];if(!Array.isArray(fx))fx=[fx];
    const g=j.general||{},tod=fx.find(x=>String(x.ident).toUpperCase()==='TOD');
    /* Strecke entlang der Route: „distance“ = Länge des Abschnitts zum Punkt → aufsummieren */
    let cum=0;const all=fx.map(x=>{cum+=+x.distance||0;return{x,cum}});const total=cum;
    const todCum=tod?all.find(a=>a.x===tod).cum:null;
    FD.plan={cs:(j.atc?.callsign||((g.icao_airline||'')+(g.flight_number||''))).toUpperCase(),dep:j.origin?.icao_code||'',arr:j.destination?.icao_code||'',
      depPos:j.origin?.pos_lat?[+j.origin.pos_lat,+j.origin.pos_long]:null,arrPos:j.destination?.pos_lat?[+j.destination.pos_lat,+j.destination.pos_long]:null,
      depElev:+(j.origin?.elevation||0),arrElev:+(j.destination?.elevation||0),crz:+(g.initial_altitude||0),ta:+(j.origin?.trans_alt||5000),tl:+(j.destination?.trans_level||7000),
      wps:all.filter(a=>a.x.pos_lat&&a.x.type!=='apt').map(a=>[+a.x.pos_lat,+a.x.pos_long,a.x.ident,a.cum]),tod:tod?[+tod.pos_lat,+tod.pos_long]:null,
      total:total||null,todCum};
    FD.planErr='';FD.sbLoaded=u;
  }catch(e){FD.planErr='SimBrief: '+(e.message||e)}
}
/* VATSIM alle 15 s */
async function pull(){
  try{
    const j=await(await fetch('https://data.vatsim.net/v3/vatsim-data.json',{cache:'no-store'})).json();
    FD.ctl=(j.controllers||[]).filter(c=>c.facility>0&&c.frequency!=='199.998');FD.atis=j.atis||[];FD.err=false;FD.t=Date.now();
    const cs=FD.plan?.cs;const p=cs?(j.pilots||[]).find(x=>String(x.callsign).toUpperCase()===cs):null;
    if(p&&Date.now()-Date.parse(p.last_updated)<180000){
      const t=Date.parse(p.last_updated);
      if(FD.prev&&t>FD.prev.t)FD.vs=Math.round((p.altitude-FD.prev.alt)/((t-FD.prev.t)/60000));
      if(!FD.prev||t>FD.prev.t)FD.prev={alt:p.altitude,t};FD.p=p;
    }else{FD.p=null;FD.vs=null;FD.prev=null}
  }catch(e){FD.err=true}
  render();
}
const nm=(a,b)=>{if(!a||!b)return null;const R=3440.065,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const alt=(a,gs)=>gs<40?'Boden':a>=(FD.plan?.ta||5000)?'FL'+String(Math.round(a/100)).padStart(3,'0'):Math.round(a/100)*100+' ft';
/* Live-Daten direkt aus dem Sim (App + PC im selben WLAN), sonst null → VATSIM */
function liveData(){
  try{if(!window.EFBApp||!EFBApp.live)return null;const s=EFBApp.live();if(!s)return null;const o=JSON.parse(s);return Date.now()-o.t<5000?o:null}catch(e){return null}
}
window.efbLive=()=>render();
let CUR={p:null,vs:null,src:''};
function phase(){
  const p=CUR.p,P=FD.plan;if(!p)return'';const me=[p.latitude,p.longitude],dD=nm(me,P.depPos),dA=nm(me,P.arrPos);
  const atArr=dA!=null&&(dD==null||dA<dD),agl=p.altitude-(atArr?P.arrElev:P.depElev),vs=CUR.vs??0;
  if(p.groundspeed<40)return atArr?(p.groundspeed<3?'am Stand':'rollt nach der Landung'):(p.groundspeed<3?'am Gate':'rollt');
  if(!atArr&&dD<8&&agl<1500)return'Start';if(atArr&&dA<10&&agl<3000)return'Endanflug';if(atArr&&dA<25&&agl<6000)return'Anflug';
  if(vs>300)return'Steigflug';if(vs<-300)return'Sinkflug';return p.altitude>=10000?'Reiseflug':atArr?'Sinkflug':'Steigflug';
}

/* Sektoren (VATSpy) – wie A4 */
const VSP='https://raw.githubusercontent.com/vatsimnetwork/vatspy-data-project/master/';
const SEC={st:'',firs:[],uirs:{},poly:{},map:{}};
async function vspGet(n){const u=VSP+n;let c=null;try{c=await caches.open('efb-vatspy')}catch(e){}
  if(c){const r=await c.match(u);if(r&&Date.now()-Date.parse(r.headers.get('date')||0)<7*864e5)return r.text()}
  const r=await fetch(u);if(!r.ok)throw new Error(n);if(c)try{await c.put(u,r.clone())}catch(e){}return r.text()}
async function loadSectors(){
  if(SEC.st)return;SEC.st='load';
  try{const[dat,geo]=await Promise.all([vspGet('VATSpy.dat'),vspGet('Boundaries.geojson')]);let sec='';
    for(const raw of dat.split(/\r?\n/)){const l=raw.trim();if(!l||l[0]===';')continue;if(l[0]==='['){sec=l;continue}const p=l.split('|');
      if(sec==='[FIRs]'&&p.length>=4)SEC.firs.push({icao:p[0],name:p[1],pre:p[2]||p[0],bnd:p[3]||p[0]});
      if(sec==='[UIRs]'&&p.length>=3)SEC.uirs[p[0]]={name:p[1],firs:p[2].split(',')}}
    for(const ft of JSON.parse(geo).features){const g=ft.geometry,id=ft.properties.id;if(!g)continue;const polys=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];
      (SEC.poly[id]=SEC.poly[id]||[]).push(...polys.map(pl=>{const ring=pl[0];let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const[x,y]of ring){a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y)}return{ring,bb:[a,b,c,d]}}))}
    SEC.st='ok'}catch(e){SEC.st='err'}
  render();
}
function inPoly(lat,lon,P){const[a,b,c,d]=P.bb;if(lon<a||lon>b||lat<c||lat>d)return false;let r=false;const R=P.ring;for(let i=0,j=R.length-1;i<R.length;j=i++){const[xi,yi]=R[i],[xj,yj]=R[j];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)r=!r}return r}
const inBnd=(id,pt)=>(SEC.poly[id]||[]).some(P=>inPoly(pt[0],pt[1],P));
function ctlSec(cs){
  if(SEC.map[cs])return SEC.map[cs];const p=cs.toUpperCase().split('_'),p1=p[0],p2=p.length>2?p[0]+'_'+p[1]:'';
  let rows=p2?SEC.firs.filter(f=>f.pre===p2):[],rank=3;
  if(!rows.length){rows=SEC.firs.filter(f=>f.pre===p1&&f.bnd===f.icao);rank=2}
  if(!rows.length){rows=SEC.firs.filter(f=>f.pre===p1);rank=2}
  if(!rows.length&&SEC.uirs[p1]){const u=SEC.uirs[p1];rows=u.firs.map(i=>SEC.firs.find(f=>f.icao===i&&f.bnd===i)||SEC.firs.find(f=>f.icao===i)).filter(Boolean).map(f=>({...f,name:u.name}));rank=1}
  let n=(rows[0]?.name||p1).split(' - ')[0].trim().replace(/\bACC\b/,'Radar');if(!/radar|control|centre|center|information/i.test(n))n=n.replace(/^([^(]*?)(\s*\(|$)/,'$1 Radar$2');
  return SEC.map[cs]={bnd:[...new Set(rows.map(r=>r.bnd))],rank,d:n};
}
const ifrCtr=c=>(c.facility===6||c.facility===1)&&!/_FIS_/.test(c.callsign);
function covers(pt){
  if(SEC.st!=='ok'||!pt)return[];
  const out=FD.ctl.filter(ifrCtr).map(c=>({c,m:ctlSec(c.callsign)})).filter(x=>x.m.bnd.some(id=>inBnd(id,pt)));
  const top=Math.max(0,...out.map(x=>x.m.rank));return out.filter(x=>x.m.rank===top).map(x=>({cs:x.c.callsign,freq:x.c.frequency,d:x.m.d}));
}
const pre=c=>c.callsign.split('_')[0];
const ROLE={2:'Delivery',3:'Ground',4:'Tower',5:'Approach'};
/* Platz: wer ist dort online (DEL/GND/TWR/APP) + ATIS */
function airport(icao){
  icao=(icao||'').toUpperCase();if(!icao)return null;
  const l=FD.ctl.filter(c=>pre(c)===icao&&c.facility>=2&&c.facility<=5).sort((a,b)=>b.facility-a.facility);
  const at=FD.atis.find(x=>pre(x)===icao);
  return{icao,list:l,atis:at?(at.atis_code||'?'):''};
}

/* Anzeige: Instrumente, TOD/ETA, Strecke, Lotsen-Zeitleiste; im Weg-Modus „Was als Nächstes kommt“ */
let NEXT={sector:null,tod:null};
const clock=min=>{const d=new Date(Date.now()+min*60000);return`${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} · ${String(d.getUTCHours()).padStart(2,'0')}${String(d.getUTCMinutes()).padStart(2,'0')}z`};
const inMin=m=>m<1?'jetzt':m<90?`in ${Math.round(m)} min`:`in ${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,'0')}`;
function render(){
  const fd=$('#fd'),atc=$('#atc');if(!fd)return;
  const P=FD.plan,u=sbName();
  if(!u){$('#fdSrc').textContent='';fd.innerHTML=`<p class="sub" style="margin-bottom:10px">SimBrief-Name fehlt (kommt sonst von der PC-Bridge).</p><div style="display:flex;gap:8px"><input id="sbIn" placeholder="SimBrief-Benutzername" autocapitalize="off" aria-label="SimBrief-Benutzername"><button class="btn-s" id="sbSave">OK</button></div>`;atc.innerHTML='<p class="sub">–</p>';return}
  if(!P){fd.innerHTML=`<p class="sub">${esc(FD.planErr||'Lade SimBrief-Plan …')}</p>`;return}
  const L=liveData();
  CUR=L?{p:{latitude:L.lat,longitude:L.lon,altitude:L.alt,groundspeed:L.gs},vs:L.vs,src:'live vom PC'}:{p:FD.p,vs:FD.vs,src:FD.p?'VATSIM · ~15 s':''};
  $('#fdSrc').textContent=CUR.src;
  const p=CUR.p;NEXT={sector:null,tod:null};
  const head=`<div class="flt"><span class="cs">${esc(P.cs)}</span><span class="rt">${esc(P.dep)} → ${esc(P.arr)}</span>${p?`<span class="chip">${esc(phase())}</span>`:''}</div>`;
  if(!p){fd.innerHTML=head+`<p class="sub">Gerade nicht mit VATSIM verbunden${window.EFBApp?' und kein Sim im WLAN':''}.${FD.err?' VATSIM ist nicht erreichbar.':''}</p>`}
  else{
    const me=[p.latitude,p.longitude],vs=CUR.vs,gs=p.groundspeed,ph=phase();
    /* Rest entlang der Route: zum nächsten Wegpunkt + aufsummierte Abschnitte bis Ziel bzw. TOD-Punkt
       (Luftlinie täuscht: der TOD kann geografisch nah am Platz liegen, wenn die STAR eine Schleife fliegt) */
    const W=P.wps||[];let dA=nm(me,P.arrPos),todFromArr=null;
    if(W.length&&P.total){
      let bi=0,bd=1e9;W.forEach((w,i)=>{const d=nm(me,w);if(d<bd){bd=d;bi=i}});
      let nx=bi;if(bi<W.length-1&&nm(me,W[bi+1])<nm(W[bi],W[bi+1]))nx=bi+1;
      dA=P.total+nm(me,W[nx])-W[nx][3];
      const todCum=P.todCum!=null?P.todCum:P.crz?P.total-Math.max(0,(P.crz-P.arrElev)*3/1000):null;
      if(todCum!=null)todFromArr=P.total-todCum;
    }else if(P.crz)todFromArr=Math.max(0,(P.crz-P.arrElev)*3/1000);
    let eta='–',etaSub='',tod='–',todSub='',todPassed=false;
    if(dA!=null&&gs>80){const m=dA/gs*60;eta=inMin(m);etaSub=`${clock(m)} · ${Math.round(dA)} NM`}
    else if(dA!=null)etaSub=`${Math.round(dA)} NM`;
    if(todFromArr!=null&&dA!=null){
      const dT=dA-todFromArr;
      if(dT<=1||/Sinkflug|Anflug|Endanflug|Landung|rollt nach|Stand/.test(ph)&&p.altitude<(P.crz||99999)-1500){tod='passiert';todSub='im Sinkflug';todPassed=true}
      else if(gs>80){const m=dT/gs*60;tod=inMin(m);todSub=`${clock(m)} · ${Math.round(dT)} NM`;NEXT.tod={m}}
      else todSub=`${Math.round(todFromArr)} NM vor ${esc(P.arr)}`;
    }
    const vsTxt=vs==null?'–':(vs>0?'+':'')+vs;
    const tot=P.total||null,frac=tot&&dA!=null?Math.max(0,Math.min(1,1-dA/tot)):null,todF=tot&&todFromArr!=null?Math.max(0,Math.min(1,1-todFromArr/tot)):null;
    fd.innerHTML=head+
      `<div class="inst"><div><b>HÖHE</b><span>${alt(p.altitude,gs)}</span></div><div><b>GS</b><span>${gs}</span><small>kt</small></div><div><b>V/S</b><span class="n">${vsTxt}</span><small>ft/min</small></div></div>`+
      `<div class="times"><div class="tile"><b>TOP OF DESCENT</b><div class="big${todPassed?'':' amber'}">${tod}</div><div class="sm">${todSub}</div></div>`+
      `<div class="tile"><b>ETA ${esc(P.arr)}</b><div class="big">${eta}</div><div class="sm">${etaSub}</div></div></div>`+
      (frac!=null?`<div class="track"><div class="line"></div><div class="done" style="width:${(frac*100).toFixed(1)}%"></div>${todF!=null?`<div class="tod" style="left:${(todF*100).toFixed(1)}%"></div><span class="lbl" style="left:${(todF*100).toFixed(1)}%">TOD</span>`:''}`+
        `<svg class="me" style="left:${(frac*100).toFixed(1)}%"><use href="#i-plane"/></svg><span class="lbl l">${esc(P.dep)}</span><span class="lbl r">${esc(P.arr)}</span></div>`:'');
  }
  // Lotsen
  if(SEC.st==='load'||SEC.st===''){atc.innerHTML='<p class="sub">Sektordaten werden geladen …</p>';window.efbAwayNext();return}
  const W=P.wps||[];let pt=null,start=0;
  if(p&&p.groundspeed>=40){pt=[p.latitude,p.longitude];let bi=-1,bd=1e9;W.forEach((w,i)=>{const d=nm(pt,w);if(d<bd){bd=d;bi=i}});start=bi+1}
  else pt=(p?[p.latitude,p.longitude]:null)||P.depPos;
  const cur=covers(pt),curCs=new Set(cur.map(x=>x.cs));let next=null,dist=0,prevPt=pt;
  for(let k=start;k<W.length;k++){dist+=nm(prevPt,W[k])||0;prevPt=W[k];const cv=covers(W[k]);if(cv.length&&!cv.some(x=>curCs.has(x.cs))){next={...cv[0],at:W[k][2],dist};break}}
  if(next&&p&&p.groundspeed>80)NEXT.sector={d:next.d,freq:next.freq,m:next.dist/p.groundspeed*60};
  const stn=(cls,lbl,x)=>`<div class="st ${cls}"><small>${lbl}</small><div class="n"><span>${esc(x.d)}</span><span class="f">${esc(x.freq)}</span></div><div class="x">${esc(x.cs)}</div></div>`;
  let h='';
  if(cur.length)h+=cur.map((x,i)=>stn('now',i?'Auch zuständig':'Jetzt',x)).join('');
  else h+=`<div class="st now"><small>Jetzt</small><div class="n"><span>Kein Center online</span><span class="f" style="color:var(--t2)">122.800</span></div><div class="x">Unicom</div></div>`;
  if(next){const when=NEXT.sector?inMin(NEXT.sector.m)+' · ':'';h+=stn('next',`${when}${next.dist>0?'in '+Math.round(next.dist)+' NM · ':''}ab ${esc(next.at)}`,next)}
  const ap=airport(P.arr);
  if(ap)h+=`<div class="st"><small>Ziel ${esc(ap.icao)}${ap.atis?' · ATIS '+esc(ap.atis):''}</small>${ap.list.length?`<div class="dest">${ap.list.map(c=>`<span class="chip">${({2:'DEL',3:'GND',4:'TWR',5:'APP'})[c.facility]||''} <em>${esc(c.frequency)}</em></span>`).join('')}</div>`:'<div class="x">Niemand online – Unicom 122.800</div>'}</div>`;
  atc.innerHTML=h;
  window.efbAwayNext();
}
/* Weg-Modus: was kommt als Nächstes (neuer Lotse, TOD) */
window.efbAwayNext=()=>{
  const el=$('#awayNext');if(!el)return;const it=[];
  if(NEXT.sector)it.push([NEXT.sector.m,`<div class="it"><span class="ic c"><svg><use href="#i-radio"/></svg></span><div class="tx"><b>Neuer Lotse</b><span>${esc(NEXT.sector.d)} · <span class="num">${esc(NEXT.sector.freq)}</span></span></div><span class="tm">${inMin(NEXT.sector.m)}</span></div>`]);
  if(NEXT.tod)it.push([NEXT.tod.m,`<div class="it"><span class="ic a"><svg><use href="#i-down"/></svg></span><div class="tx"><b>Top of Descent</b><span>Sinkflug anfragen</span></div><span class="tm">${inMin(NEXT.tod.m)}</span></div>`]);
  el.innerHTML=it.length?it.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(''):'<div class="it"><div class="tx"><span>Gerade steht nichts an.</span></div></div>';
};
document.addEventListener('click',e=>{
  if(e.target.closest('#sbSave')){const v=$('#sbIn').value.trim();if(v){localStorage.setItem('efb.sb',v);loadPlan().then(pull)}}
});
async function cycle(){ if(sbName()&&sbName()!==FD.sbLoaded)await loadPlan(); await pull(); }
loadSectors();
setTimeout(()=>{cycle();setInterval(cycle,15000)},800);   // kurz warten, bis der Status (SimBrief-Name) da ist
setInterval(loadPlan,10*60000);
}
</script>
</body>
</html>
